  const lines = L.geoJSON(S, {style, renderer: r, onEachFeature: bindStream});
  const streams = L.layerGroup([halo, lines]).addTo(map);
  // Reaches lying in a lake (STREAMS_LAKE, 06_map.py): the Lakes layer draws that water, so they show only while Lakes
  // is off, and then like any other stream (the user, 2026-11-20: the rivers run on through the lakes when it's off)
  const SL = {type: "FeatureCollection", features: (window.STREAMS_LAKE || {}).features || []};
  SL.features.forEach(f => { f.properties.lk = 1; });
  const lakeHalo = L.geoJSON(SL, {filter: f => f.properties.o >= 3, style: hstyle, interactive: false,
                                  renderer: halo.options.renderer});
  const lakeLines = L.geoJSON(SL, {style, renderer: r, onEachFeature: bindStream});
  const lakeStreams = L.layerGroup([lakeHalo, lakeLines]);
  function syncLakeStreams() {
    const li = (ctrl._layers || []).find(x => x.overlay && /Lakes:/.test(x.name));
    const want = SL.features.length > 0 && map.hasLayer(streams) && !(li && map.hasLayer(li.layer));
    if (want && !map.hasLayer(lakeStreams)) { lakeStreams.addTo(map); restack(); }
    else if (!want && map.hasLayer(lakeStreams)) map.removeLayer(lakeStreams);
  }
  const basinLayer = L.layerGroup([fills, divides]).addTo(map);

  // ---- Pacific Crest Trail (02c_pct.py): thin dark dashed line on a soft yellow band, above the streams ----
  const LONGTRAIL = (window.LBL || {}).long_trail || "Pacific Crest Trail";   // the area's long-distance trail
  const pctGroup = L.layerGroup();
  const pctLabs = [];   // [label centre, angle, SVG <text>, zoom band]
  let pctLines = [];
  if (window.PCT) {
    const pr = r;   // drawn on the streams canvas, on top
    const pw = () => Math.max(0.8, Math.min(1.5, 0.8 + (map.getZoom() - 9) * 0.18));
    const mk = (st, extra = {}) => L.geoJSON(window.PCT, {renderer: pr, style: st, ...extra});
    pctLines = [
      mk(() => ({color: "#ffd43b", weight: 7 * pw(), opacity: 0.45, lineCap: "round", lineJoin: "round"}), {interactive: false}),
      mk(() => ({color: "#ffffff", weight: 3.4 * pw(), opacity: 0.9, lineCap: "round", lineJoin: "round"}), {interactive: false}),
      mk(() => ({color: "#1d1d1f", weight: 1.7 * pw(), opacity: 1, dashArray: "6 4", lineCap: "butt", lineJoin: "round"}), {
        onEachFeature: (f, l) => l.bindTooltip(
          `<b>${LONGTRAIL}</b><div class="dw">${esc(f.properties.label)}</div>`,
          {sticky: true, className: "stip", direction: "top", offset: [0, -8]})}),
    ];
    pctLines.forEach(l => pctGroup.addLayer(l));
    pctGroup.addTo(map);
    // Labels run along smoothed copies of the trail (SVG textPath), so the lettering bends with the line. The
    // invisible label paths stay on the map; updateLabels shows or hides the text.
    const lp = map.createPane("pctlab");
    lp.style.zIndex = 452;
    lp.style.pointerEvents = "none";
    const sr = L.svg({pane: "pctlab", padding: 0.5});
    const NS = "http://www.w3.org/2000/svg";
    (window.PCT_LABEL_LINES || []).forEach((lab, i) => {
      const pl = L.polyline(lab.p.map(([x, y]) => [y, x]), {renderer: sr, stroke: false, fill: false,
                                                           interactive: false, noClip: true, smoothFactor: 0}).addTo(map);
      pl._path.id = "pctlp" + i;
      const t = document.createElementNS(NS, "text"), tp = document.createElementNS(NS, "textPath");
      t.setAttribute("class", "pctt");
      t.setAttribute("dy", "-8");
      tp.setAttribute("href", "#pctlp" + i);
      tp.setAttribute("startOffset", "50%");
      tp.setAttribute("text-anchor", "middle");
      tp.textContent = LONGTRAIL;
      t.appendChild(tp);
      pl._path.parentNode.appendChild(t);
      pctLabs.push([L.latLng(lab.c), lab.a, t, lab.z]);
    });
  }
  const restylePct = () => pctLines.forEach(l => l.setStyle(l.options.style));

  // ---- trails and fire roads (02d_trails.py): brown dashes on a white edge, more detail with each zoom level ----
  // rank 1 hiking routes and named trails (z10+), 2 named fire roads (z11+), 3 unnamed trails (z12+), 4 unnamed fire
  // roads (z13+). Fire roads: longer dashes, a little wider. Closed or private: faded. Informal or faint: dotted.
  const trailGroup = L.layerGroup();
  const trailLabs = [];
  const TRAIL_MINZ = {1: 10, 2: 11, 3: 12, 4: 13};
  const trailLayers = {};
  let trailShown = "";
  const tw = f => Math.max(1, Math.min(3.2, 1 + (map.getZoom() - 10) * 0.4)) * (f.properties.k === "fire road" ? 1.25 : 1);
  const tstyle = f => {
    const p = f.properties, w = tw(f);
    const dash = p.f ? [0.8, 2.2] : p.k === "fire road" ? [5, 1.8] : [2.6, 1.8];
    return {color: p.k === "fire road" ? "#7a5a3a" : "#5c3317", weight: w, opacity: p.cl ? 0.4 : p.f ? 0.75 : 1,
            dashArray: dash.map(v => (v * w).toFixed(1)).join(" "), lineCap: "butt", lineJoin: "round"};
  };
  // mountain bike access (02d_trails.py), shown as the colour of the trail's edge while "Mountain bike access on
  // trails" is on; unknown keeps the plain white edge
  const BIKE = {yes: ["#37b24d", "Open to bikes"], likely: ["#a9e34b", "Likely OK for bikes"],
                unlikely: ["#ffa94d", "Probably no bikes"], no: ["#f03e3e", "No bikes"], unknown: ["#ffffff", "Unknown"]};
  let bikeOn = true;
  const thalo = f => {
    const b = bikeOn && f.properties.b && f.properties.b !== "unknown" && BIKE[f.properties.b];
    return {color: b ? b[0] : "#ffffff", weight: tw(f) + (b ? 3.6 : 2.4),
            opacity: f.properties.cl ? 0.35 : b ? 0.85 : 0.75, lineCap: "round", lineJoin: "round"};
  };
  const bikeLine = p => {
    if (!p.b) return "";
    const why = String(p.bw || "").replace(/:\s*(no bikes|open to bikes)$/i, "");
    const lab = BIKE[p.b] ? BIKE[p.b][1] : p.b;
    return `<span style="color:${p.b === "no" ? "#c92a2a" : p.b === "yes" ? "#2b8a3e" : "inherit"}">Bikes: ${lab}</span>` +
      (why && why.toLowerCase() !== lab.toLowerCase() && p.b !== "unknown" ? ` <span class="dm">(${esc(why)})</span>` : "") +
      (p.mtb ? ` · MTB difficulty S${esc(p.mtb)}` : "");
  };
  const ttip = window.trailTip = p => `<b>${esc(p.n || (p.k === "fire road" ? "Unnamed fire road" : "Unnamed trail"))}</b>` +
    `<div class="dw">${p.k === "fire road" ? (p.g ? "Fire road, gated to cars" : "Fire road / dirt road") : "Trail"}` +
    `${p.rt && p.rt !== p.n ? " · " + esc(p.rt) : ""}</div>` +
    [p.of ? `Official trail · ${esc(p.of)}${p.no ? " #" + esc(p.no) : ""}` : "",
     p.us ? "Open to: " + esc(p.us) : "",
     p.g ? `USFS road ${esc(p.g)}: closed to public vehicles, open on foot` : "",
     p.u ? "<span class='dm'>Possibly unofficial: not in agency trail data</span>" : "",
     p.src ? "<span class='dm'>From agency records only; not in OpenStreetMap, may be faint or abandoned</span>" : "",
     p.s ? "Difficulty: " + esc(p.s) : "", p.sf ? "Surface: " + esc(p.sf) : "",
     p.cl ? `<span class='warn'>Closed${p.cw ? ": " + esc(p.cw) : " or private"}</span>` : "",
     p.f && !p.u && !p.src ? "Informal or faint trail" : "", bikeLine(p)].filter(Boolean).join("<br>");
  const bikeView = L.layerGroup();
  if (window.TRAILS) {
    const trr = r;   // drawn on the streams canvas, above the streams
    [1, 2, 3, 4].forEach(rk => {
      const data = {type: "FeatureCollection", features: window.TRAILS.features.filter(f => f.properties.rk === rk)};
      const thalf = f => z => (Math.max(1, Math.min(3.2, 1 + (z - 10) * 0.4)) * (f.properties.k === "fire road" ? 1.25 : 1)
                              + 3.6) / 2;
      trailLayers[rk] = [
        L.geoJSON(data, {renderer: trr, interactive: false, style: thalo,
                         onEachFeature: (f, l) => { l.options.offset = beside(f.properties, thalf(f)); }}),
        L.geoJSON(data, {renderer: trr, style: tstyle, onEachFeature: (f, l) => {
          l.options.offset = beside(f.properties, thalf(f));
          l.bindTooltip(() => ttip(f.properties), {sticky: true, className: "stip", direction: "top", offset: [0, -6]});
          l.on("mouseover", () => showHover(l, tstyle(f).color, tw(f) + 2));
          l.on("mouseout", hideHover);
        }}),
      ];
    });
    // (not on the map until it is switched on in the layer list: the map opens with streams, drainages, the long
    // trail, terrain shading and place labels only)
    // names along named trails and fire roads from z13 (SVG text on smoothed paths, as for the PCT); only the current
    // zoom band's labels near the view are on the map at any time
    const lp2 = map.createPane("trlab");
    lp2.style.zIndex = 451;
    lp2.style.pointerEvents = "none";
    const sr2 = L.svg({pane: "trlab", padding: 0.5});
    const NS2 = "http://www.w3.org/2000/svg";
    (window.TRAIL_LABEL_LINES || []).forEach((lab, i) => {
      const pl = L.polyline(lab.p.map(([x, y]) => [y, x]), {renderer: sr2, stroke: false, fill: false,
                                                           interactive: false, noClip: true, smoothFactor: 0});
      const t = document.createElementNS(NS2, "text"), tp = document.createElementNS(NS2, "textPath");
      t.setAttribute("class", "trlt");
      t.setAttribute("dy", "-5");
      tp.setAttribute("href", "#trlp" + i);
      tp.setAttribute("startOffset", "50%");
      tp.setAttribute("text-anchor", "middle");
      tp.textContent = lab.t;
      t.appendChild(tp);
      pl.on("add", () => { pl._path.id = "trlp" + i; pl._path.parentNode.appendChild(t); });
      pl.on("remove", () => t.remove());
      trailLabs.push({pl, ll: L.latLng(lab.c), a: lab.a, z: lab.z, w: lab.t.length * 5.6 + 6, on: false});
    });
  }
  // ---- access roads (02e_access.py): one layer per what it takes to get up them. Cased lines (light centre, dark
  // edge) read as roads rather than streams; dashed centres for 4WD, bike-only and unknown-condition roads.
  //   class: [label, centre, edge, dash (x width), min zoom, on by default]
  const ROAD = {
    paved:          ["Paved: any car", "#ffffff", "#7a828c", null, 10, false],
    graded:         ["Graded dirt: car OK when dry", "#f3d9a4", "#8a6d3b", null, 10, true],
    high_clearance: ["Rough dirt: high clearance", "#ffc078", "#b35900", null, 10, true],
    "4wd":          ["Very rough: 4WD only", "#ffa8a8", "#a51d2d", [3, 2], 10, true],
    bike:           ["Closed to cars, open to bikes", "#b2f2bb", "#2b8a3e", [3, 2], 10, true],
    dirt:           ["Dirt road, condition unknown", "#e9ecef", "#7a828c", [1.5, 2], 11, true],
    closed:         ["Closed: fire closure", "#ffc9c9", "#c92a2a", [2, 2], 10, true],
  };
  const LEVEL = {1: "closed / custodial", 2: "high-clearance vehicles", 3: "passenger cars", 4: "moderate comfort",
                 5: "high comfort"};
  const roadGroups = {}, roadLayers = {}, roadOverlays = [];
  const rw = () => Math.max(1.2, Math.min(4, 1.2 + (map.getZoom() - 10) * 0.55));
  const rtip = p => `<b>${esc(p.n || "Unnamed road")}</b><div class="dw">${ROAD[p.c][0]}</div>` +
    [p.fs ? `USFS road ${esc(p.fs)}${p.lv ? ` · maintenance level ${p.lv} (${LEVEL[p.lv] || ""})` : ""}` : "",
     p.sf ? "Surface: " + esc(p.sf) : "", p.tt ? `Track grade ${esc(String(p.tt).replace("grade", ""))} of 5` : "",
     p.sm ? "Smoothness: " + esc(String(p.sm).replace(/_/g, " ")) : "",
     p.se === "yes" ? "<span class='warn'>Seasonal road</span>" : "", p.ac ? "Restrictions: " + esc(p.ac) : "",
     p.mv ? "Forest Service vehicle rules: " + esc(p.mv) : "", p.od ? "<span class='warn'>Open to " + esc(p.od) + "</span>" : "",
     p.cw ? "<span class='warn'>" + esc(p.cw) + "</span>" : "",
     p.src ? "<span class='dm'>From Forest Service records only; not in OpenStreetMap, may be overgrown or gated</span>" : ""]
      .filter(Boolean).join("<br>");
  if (window.ROADS) {
    Object.entries(ROAD).forEach(([c, [label, core, edge, dash, minz, on]]) => {
      const data = {type: "FeatureCollection", features: window.ROADS.features.filter(f => f.properties.c === c)};
      if (!data.features.length) return;
      const rhalf = z => (Math.max(1.2, Math.min(4, 1.2 + (z - 10) * 0.55)) + 2.2) / 2;
      const edgeL = L.geoJSON(data, {renderer: r, interactive: false,
        style: () => ({color: edge, weight: rw() + 2.2, opacity: 0.9, lineCap: "round", lineJoin: "round"}),
        onEachFeature: (f, l) => { l.options.offset = beside(f.properties, rhalf); }});
      const coreL = L.geoJSON(data, {renderer: r,
        style: () => ({color: core, weight: rw(), opacity: 1, lineCap: dash ? "butt" : "round", lineJoin: "round",
                       dashArray: dash ? dash.map(v => (v * rw()).toFixed(1)).join(" ") : null}),
        onEachFeature: (f, l) => {
          l.options.offset = beside(f.properties, rhalf);
          l.bindTooltip(() => rtip(f.properties), {sticky: true, className: "stip", direction: "top", offset: [0, -6]});
          l.on("mouseover", () => showHover(l, edge, rw() + 4));
          l.on("mouseout", hideHover);
        }});
      roadLayers[c] = [edgeL, coreL, minz];
      roadGroups[c] = L.layerGroup();
      roadOverlays.push([roadGroups[c], `<span class="rsym" style="background:${core};border-color:${edge}` +
                         `${dash ? ";border-style:dashed" : ""}"></span> ${label}`]);
    });
  }
  function updateRoads() {
    const z = map.getZoom();
    let added = false;
    Object.entries(roadLayers).forEach(([c, [edgeL, coreL, minz]]) => {
      const g = roadGroups[c];
      if (z < minz) { if (g.hasLayer(coreL)) g.clearLayers(); return; }
      if (!g.hasLayer(coreL)) { g.addLayer(edgeL); g.addLayer(coreL); added = true; }
      edgeL.setStyle(edgeL.options.style); coreL.setStyle(coreL.options.style);   // also when just re-added (stale width)
    });
    if (added) restack();
  }

  // ---- trailheads and parking (02e_access.py): trailheads from z11, parking from z12, only those near the view ----
  const thGroup = L.layerGroup(), pkGroup = L.layerGroup(), acGroup = L.layerGroup(), pois = [];
  const poiClosed = p => /closed/i.test(p.st || "");
  // official fishing access sites and boat ramps (02e_access.py, accesspoints.py): type, water, agency, parking, link
  const acType = p => (p.t || "fishing access").replace(/^./, c => c.toUpperCase());
  const acTip = p => `<b>${esc(p.n || acType(p))}</b>` + (p.st ? `<div class="warn">${esc(p.st[0].toUpperCase() + p.st.slice(1))}</div>` : "") +
    `<div class="dw">${esc(acType(p))}${p.w ? " · " + esc(p.w) : ""}</div>` +
    [p.p ? "Parking" : "", p.no ? `<span class="dm">${esc(p.no)}</span>` : "", `<span class="dm">Official access: ${esc(p.src)}</span>`]
      .filter(Boolean).join("<br>");
  const poiTip = p => p.k === "access" ? acTip(p) : `<b>${esc(p.n || (p.k === "trailhead" ? "Trailhead" : "Parking"))}</b>` +
    (poiClosed(p) ? `<div class="warn">${esc(p.st[0].toUpperCase() + p.st.slice(1))} (Forest Service status)</div>` : "") +
    `<div class="dw">${p.k === "trailhead" ? "Trailhead" + (p.p ? " with parking" : "") : "Parking"}` +
    `${p.src === "USFS" ? " · Forest Service" : ""}</div>` +
    [p.fee === "yes" ? "Fee or pass required" : p.fee === "no" ? "No fee" : "", p.cap ? "Spaces: " + esc(p.cap) : "",
     p.no ? `<span class="dm">${esc(p.no)}</span>` : ""].filter(Boolean).join("<br>");
  if (window.PARKING) {
    window.PARKING.features.forEach(f => {
      const p = f.properties, th = p.k === "trailhead", ac = p.k === "access";
      const html = th ? `<div class="poi th${poiClosed(p) ? " closed" : ""}">T${p.p ? '<span class="pb">P</span>' : ""}</div>`
                 : ac ? `<div class="poi ac${poiClosed(p) ? " closed" : ""}">A</div>` : `<div class="poi pk">P</div>`;
      const mk = L.marker([f.geometry.coordinates[1], f.geometry.coordinates[0]], {keyboard: false,
        icon: L.divIcon({className: "", html, iconSize: [18, 18], iconAnchor: [9, 9]})});
      mk.bindTooltip(() => poiTip(p), {direction: "top", offset: [0, -10], className: "stip"});
      if (p.u) mk.bindPopup(() => poiTip(p) + `<br><a href="${esc(p.u)}" target="_blank">${ac ? esc(p.src.split(", ")[0]) : "Forest Service"} page ↗</a>`,
                            {maxWidth: 300});
      pois.push({mk, th, ac, ll: mk.getLatLng(), on: false});
    });
  }
  function updatePois() {
    const z = map.getZoom(), view = map.getBounds().pad(0.3);
    pois.forEach(o => {
      const g = o.th ? thGroup : o.ac ? acGroup : pkGroup;
      const want = map.hasLayer(g) && z >= (o.th || o.ac ? 11 : 12) && view.contains(o.ll);
      if (want && !o.on) { g.addLayer(o.mk); o.on = true; }
      else if (!want && o.on) { g.removeLayer(o.mk); o.on = false; }
    });
  }
  map.on("moveend overlayadd overlayremove", updatePois);

  // keep the shared canvas's draw order: streams, then roads, then trails, then the PCT (re-added layers go on top)
  function restack() {
    Object.values(roadGroups).forEach(g => { if (map.hasLayer(g)) g.eachLayer(l => l.bringToFront()); });
    // halos first, then lines, rank 1 last so it ends on top (the group's own order is the order the layers were made)
    if (map.hasLayer(trailGroup)) [0, 1].forEach(i => [4, 3, 2, 1].forEach(rk => {
      const l = trailLayers[rk] && trailLayers[rk][i];
      if (l && trailGroup.hasLayer(l)) l.bringToFront();
    }));
    if (map.hasLayer(pctGroup)) pctLines.forEach(l => l.bringToFront());
    adopted.forEach(l => { if (!(l instanceof L.Polygon)) l.bringToFront(); });   // overlay points and lines on top
  }
  function updateTrails() {
    const z = map.getZoom();
    const want = [4, 3, 2, 1].filter(rk => trailLayers[rk] && z >= TRAIL_MINZ[rk]);
    if (want.join() !== trailShown) {   // tiers change: re-add in order (halos under lines, rank 1 on top)
      trailGroup.clearLayers();
      want.forEach(rk => trailGroup.addLayer(trailLayers[rk][0]));
      want.forEach(rk => trailGroup.addLayer(trailLayers[rk][1]));
      trailShown = want.join();
      restack();
    }
    // widths follow the zoom on every step, also the one that changes the tiers: a re-added layer keeps the style it
    // last had, so trails stayed at the width of the zoom they were first shown at
    want.forEach(rk => { trailLayers[rk][0].setStyle(thalo); trailLayers[rk][1].setStyle(tstyle); });
  }

  // ---- labels: drainages always (small ones from z10), forks from z11 ----
  const labels = L.layerGroup().addTo(map);
  const dlabs = [], flabs = [];
  DR.forEach(d => {
    if (!d.lab) return;
    const mk = L.marker(d.lab, {pane: "dlabels", interactive: false, keyboard: false,
      icon: L.divIcon({className: "dlab", iconSize: null, html: `<span style="color:${d.dark}">${esc(d.name)}</span>`})});
    dlabs.push([mk, d, d.km2 || 0]);
    (d.forks || []).forEach(f => {
      if (f.name === d.name || d.forks.length < 2 || f.name.includes("unnamed fork")) return;
      const fm = L.marker(f.lab, {pane: "dlabels", interactive: false, keyboard: false,
        icon: L.divIcon({className: "flab", iconSize: null, html: `<span style="color:${d.dark}">${esc(f.name)}</span>`})});
      flabs.push([fm, d, f.km2]);
    });
  });
  // biggest first; a label is skipped where it would overlap one already placed
  dlabs.sort((x, y) => y[2] - x[2]);
  flabs.sort((x, y) => y[2] - x[2]);
  function updateLabels() {
    const z = map.getZoom(), boxes = [];
    labels.clearLayers();
    const fits = (ll, w, h) => {
      const p = map.latLngToLayerPoint(ll);
      const b = [p.x - w / 2 - 4, p.y - h / 2 - 3, p.x + w / 2 + 4, p.y + h / 2 + 3];
      if (boxes.some(o => b[0] < o[2] && b[2] > o[0] && b[1] < o[3] && b[3] > o[1])) return false;
      boxes.push(b);
      return true;
    };
    const show = (list, cw, h, ok) => list.forEach(([mk, d]) => {
      const name = mk.options.icon.options.html.replace(/<[^>]+>/g, "");
      if (ok(d) && !(focus && d.name !== focus) && fits(mk.getLatLng(), name.length * cw, h)) labels.addLayer(mk);
    });
    // PCT labels first (they win collisions); boxes are the label's axis-aligned extent at its general angle.
    // Each zoom band (11, 12, 13+) has its own label paths, smoothed for that scale (06_map.py).
    const band = Math.min(13, Math.floor(z));
    pctLabs.forEach(([ll, ang, t, zb]) => {
      const a = ang * Math.PI / 180, w = 112, h = 12;
      const on = z >= 11 && zb === band && map.hasLayer(pctGroup) &&
        fits(ll, Math.abs(w * Math.cos(a)) + Math.abs(h * Math.sin(a)), Math.abs(w * Math.sin(a)) + Math.abs(h * Math.cos(a)));
      t.style.display = on ? "" : "none";
    });
    if (map.hasLayer(basinLayer)) {
      show(dlabs, 8.2, 11, d => z <= 13 && (z >= 10 || d.km2 >= 45));
      if (z >= 11) show(flabs, 6.6, 12, () => true);
    }
    // trail names last (lowest priority), only near the view
    const tband = z >= 14 ? 14 : 13, view = map.getBounds().pad(0.2);
    trailLabs.forEach(L_ => {
      const a = L_.a * Math.PI / 180, h = 11;
      const want = z >= 13 && L_.z === tband && map.hasLayer(trailGroup) && view.contains(L_.ll) &&
        fits(L_.ll, Math.abs(L_.w * Math.cos(a)) + Math.abs(h * Math.sin(a)), Math.abs(L_.w * Math.sin(a)) + Math.abs(h * Math.cos(a)));
      if (want && !L_.on) { L_.pl.addTo(map); L_.on = true; }
      else if (!want && L_.on) { L_.pl.remove(); L_.on = false; }
    });
  }

  function restyle() {
    lines.setStyle(style); halo.setStyle(hstyle); lakeLines.setStyle(style); lakeHalo.setStyle(hstyle);
    if (likeGlow) likeGlow.setStyle(gstyle);
    fills.setStyle(f => ({fillOpacity: fillOp(f)}));
    divides.setStyle(f => ({opacity: dim({d: f.properties.drainage}) ? 0.25 : 0.55}));
    restylePct(); updateRoads(); updateTrails(); updateLabels(); updatePois(); renderKey();
  }
  map.on("zoomend", restyle);

  ctrl.addOverlay(basinLayer, "<span style='color:#3d4651'>▭</span> Drainage outlines &amp; names");

  if (window.TRAILS) ctrl.addOverlay(trailGroup, "<span class='trsym'>┅</span> Trails &amp; fire roads");

  roadOverlays.forEach(([g, label]) => ctrl.addOverlay(g, "Roads: " + label));

  // ---- the layer list, as the 3D map's "View & layers" panel (the user, 2026-11-23): a header whose "–" folds the
  // list and stays put while the list under it scrolls (map_style.css), and groups of entries with one switch for them
  // all: the drops with the known falls, the trails with their bike colouring (a group of their own: the way on from
  // the road on foot or by bike, where "All roads" shows what a car can drive), and the roads. Each entry keeps its own
  // switch. A group's switch shows all on, all off or mixed; it turns them all on, or all off when they all are.

  // one the 3D map and the one-file map use too: each gets its key there (layers made here by their object, folium's
  // by their names), and every rebuild sorts the list by it (a stable sort: the basemaps keep theirs).
  const lyc = ctrl.getContainer();
  const lyh = L.DomUtil.create("div", "lyh");
  lyh.innerHTML = `<b>View &amp; layers</b><button type="button" class="lx" title="Hide the layer list">–</button>`;
  lyc.insertBefore(lyh, ctrl._section);
  L.DomEvent.on(lyh.querySelector(".lx"), "click", e => { L.DomEvent.stop(e); ctrl.collapse(); });
  const KEYED = new Map([[streams, "streams"], [basinLayer, "basins"], [pctGroup, "pct"], [trailGroup, "trails"],
                         [bikeView, "bike"], [thGroup, "poi-th"], [pkGroup, "poi-pk"], [acGroup, "poi-ac"],
                         ...Object.entries(roadGroups).map(([c, g]) => [g, "road-" + c])]);
  const keyOf = o => o._key !== undefined ? o._key : (o._key = KEYED.get(o.layer) || layerKey2d(o.name, window.LBL));
  const LGROUPS = [["All drops &amp; waterfalls", k => k === "falls" || /^drop:/.test(k)],
                   ["All trails &amp; bike access", k => k === "trails" || k === "bike"],
                   ["All roads", k => /^road-/.test(k)]];
  const lgroups = [];      // [the group's checkbox, its layers] as laid out by the last rebuild
  const syncGroups = () => lgroups.forEach(([cb, ls]) => {
    const n = ls.filter(l => map.hasLayer(l)).length;
    cb.checked = n === ls.length;

  });
  const rebuild = ctrl._update;
  ctrl._update = function () {
    const top = this._section ? this._section.scrollTop : 0;
    this._layers.sort((a, b) => (a.overlay ? layerRank(keyOf(a)) : -1) - (b.overlay ? layerRank(keyOf(b)) : -1));
    rebuild.call(this);
    lgroups.length = 0;
    const items = this._layerControlInputs.map(inp => [inp, this._getLayer(inp.layerId)]).filter(([, o]) => o && o.overlay);
    LGROUPS.forEach(([title, test]) => {
      const mine = items.filter(([, o]) => test(keyOf(o) || ""));
      if (mine.length < 2) return;
      const first = mine[0][0].closest("label"), grp = L.DomUtil.create("div", "lgrp");
      first.parentNode.insertBefore(grp, first);
      L.DomUtil.create("label", "lgh", grp).innerHTML = `<span class="lgn"></span><span><input type="checkbox" ` +
        `class="leaflet-control-layers-selector"><span> ${title}</span></span>`;
      const members = L.DomUtil.create("div", "lgm", grp);
      mine.forEach(([inp]) => members.appendChild(inp.closest("label")));
      const cb = grp.querySelector("input"), ls = mine.map(([, o]) => o.layer);
      L.DomEvent.on(cb, "change", () => {
        const on = !ls.every(l => map.hasLayer(l));
        this._handlingClick = true;            // as for a click on an entry: no rebuild of the list per layer
        ls.forEach(l => { if (on !== map.hasLayer(l)) { if (on) map.addLayer(l); else map.removeLayer(l); } });
        this._handlingClick = false;
        this._layerControlInputs.forEach(inp => { inp.checked = map.hasLayer(this._getLayer(inp.layerId).layer); });
        syncGroups();
      });
      lgroups.push([cb, ls]);
    });

    if (this._section) this._section.scrollTop = top;
    return this;
  };
  map.on("overlayadd overlayremove", syncGroups);   // an entry's own switch (Leaflet doesn't rebuild the list then)
  ctrl._update();

  // ---- legend panel ----
  const panel = L.control({position: "bottomleft"});
  panel.onAdd = () => {
    const div = L.DomUtil.create("div", "lgd");
    const LBLX = window.LBL || {};
    div.innerHTML = `<div class="lh"><b>${LBLX.title || "LA mountain streams"}</b><span><a class="to3d" href="stream_map_3d.html">3D view ↗</a><select class="areasel" title="Go to another area" style="font:inherit;font-size:11px;max-width:108px;margin-left:6px;border:1px solid #c9ced6;border-radius:5px;background:#fff;color:#1d1d1f;padding:1px 2px">${["<option value=''>Go to…</option>", "<option value='*'>All areas map</option>"].concat(((LBLX.areas) || []).filter(a => a.k !== LBLX.area).map(a => `<option value="${a.k}">${a.t}</option>`)).join("")}</select>
      <button class="lx" title="Hide / show">–</button></span></div>
      <div class="lb">
        <div class="seg">${[["drainage", "Drainage"], ["order", "Stream order"], ["fish", "Fish score"]]
          .map(([k, t]) => `<button data-m="${k}">${t}</button>`).join("")}</div>
        <div class="key"></div>
        <div class="wk"><span class="dm">Line width = Strahler order</span>${[1, 2, 3, 4, 5, 6].map(o =>
          `<span class="wo"><svg width="26" height="10"><line x1="2" y1="5" x2="24" y2="5" stroke="#445" stroke-width="${W[o]}" stroke-linecap="round"/></svg>${o}</span>`).join("")}</div>
        ${window.PCT ? `<div class="pk"><svg width="40" height="12"><line x1="4" y1="6" x2="36" y2="6" stroke="#ffd43b" stroke-opacity=".45" stroke-width="7" stroke-linecap="round"/><line x1="4" y1="6" x2="36" y2="6" stroke="#fff" stroke-opacity=".9" stroke-width="3.4" stroke-linecap="round"/><line x1="4" y1="6" x2="36" y2="6" stroke="#1d1d1f" stroke-width="1.7" stroke-dasharray="6 4"/></svg>${LONGTRAIL}</div>` : ""}
        ${window.TRAILS ? `<div class="pk tk"><svg width="34" height="10"><line x1="2" y1="5" x2="32" y2="5" stroke="#fff" stroke-width="4.4"/><line x1="2" y1="5" x2="32" y2="5" stroke="#5c3317" stroke-width="2" stroke-dasharray="5.2 3.6"/></svg>Trail
          <svg width="34" height="10"><line x1="2" y1="5" x2="32" y2="5" stroke="#fff" stroke-width="4.9"/><line x1="2" y1="5" x2="32" y2="5" stroke="#7a5a3a" stroke-width="2.5" stroke-dasharray="12.5 4.5"/></svg>Fire road</div>
          <div class="bk"><span class="dm">Trail edge = mountain bikes:</span> ${["yes", "likely", "unlikely", "no"].map(k =>
            `<span class="bkc"><i style="background:${BIKE[k][0]}"></i>${BIKE[k][1].replace(" for bikes", "").replace("Open to bikes", "Open")}</span>`).join("")}</div>` : ""}
        ${LBLX.stale_line ? `<div class="asof" title="These layers' downloads failed when the map was built: they show the last good copy, of that day">${esc(LBLX.stale_line)}</div>` : ""}
      </div>`;
    L.DomEvent.disableClickPropagation(div);
    L.DomEvent.disableScrollPropagation(div);
    div.querySelector(".lx").onclick = e => {
      div.classList.toggle("min"); e.target.textContent = div.classList.contains("min") ? "+" : "–";
    };
    div.querySelectorAll(".seg button").forEach(b => b.onclick = () => { mode = b.dataset.m; restyle(); });
    return div;
  };
  panel.addTo(map);
  const box = panel.getContainer();
  // the trail and bike keys show only while the trail layer is on
  const trailKey = () => { const on = map.hasLayer(trailGroup);
    box.querySelectorAll(".tk").forEach(el => { el.style.display = on ? "" : "none"; });
    box.querySelectorAll(".bk").forEach(el => { el.style.display = on && map.hasLayer(bikeView) ? "" : "none"; }); };
  map.on("overlayadd overlayremove", trailKey);
  trailKey();

  // a focused drainage stays focused across colour modes, so every mode shows how to clear it
  const focusBar = () => focus ? `<div class="fbar">Showing <b>${esc(focus)}</b> · <a href="#" class="clr">show all</a></div>` : "";
  function bindClear(key) {
    const clr = key.querySelector(".clr");
    if (clr) clr.onclick = e => { e.preventDefault(); focus = null; restyle(); };
  }
  function renderKey() {
    box.querySelectorAll(".seg button").forEach(b => b.classList.toggle("on", b.dataset.m === mode));
    const key = box.querySelector(".key");
    if (mode === "fish") {
      const tc = window.troutCal && troutCal.ready() ? troutCal : null;
      key.innerHTML = focusBar() + `<div class="ramp"><i style="background:${LOWCOL};flex:.9"></i>${RAMP.map(c => `<i style="background:${c}"></i>`).join("")}</div>
        <div class="rl"><span>0</span><span>${LOW}</span><span>fish score</span><span>100</span></div>` +
        (tc ? `<label class="calwhen">When <select>${[`<option value="">any time (the fish score)</option>`].concat(
          Array.from({length: 24}, (_, h) => `<option value="${h}"${h === calH ? " selected" : ""}>${tc.name(h)}` +
            `${h === tc.now() ? " (now)" : ""}</option>`)).join("")}</select></label>` : "") +
        `<div class="dm">${calH === null || !tc ? `Gray = under ${LOW} (dry, tiny or burned). Wider = better.`
          : `The fish score × how ${tc.name(calH)} rates on each creek (trout calendar, in its popup). Gray = under ${LOW}.`}</div>`;
      const sel = key.querySelector(".calwhen select");
      if (sel) sel.onchange = () => { calH = sel.value === "" ? null : +sel.value; restyle(); };
      bindClear(key);
      return;
    }
    if (mode === "order") {
      key.innerHTML = focusBar() + `<div class="ramp">${BLUE.slice(1, 7).map(c => `<i style="background:${c}"></i>`).join("")}</div>
        <div class="rl"><span>1</span><span>Strahler order</span><span>6</span></div>`;
      bindClear(key);
      return;
    }
    const byReg = {};
    DR.forEach(d => (byReg[d.region || "Other"] ??= []).push(d));

      `<div class="dl">` + Object.entries(byReg).map(([reg, ds]) =>
        (reg !== "Other" ? `<div class="rg">${esc(reg)}</div>` : "") + ds.map(d =>
          `<div class="di${focus === d.name ? " on" : ""}${focus && focus !== d.name ? " off" : ""}" data-d="${esc(d.name)}">` +
          `<i style="background:${d.color}"></i><span>${esc(d.name)}</span>` +
          (d.km2 ? `<em>${SQMI(d.km2)}</em>` : "") + `</div>` +
          (focus === d.name && d.forks && d.forks.length > 1 ? d.forks.map(f =>
            `<div class="fk"><i style="background:${f.color}"></i>${esc(f.name)}<em>${SQMI(f.km2)}</em></div>`).join("") : "")
        ).join("")).join("") + `</div>`;
    key.querySelectorAll(".di").forEach(el => el.onclick = () => {
      const d = DR.find(x => x.name === el.dataset.d);

      focus = focus === d.name ? null : d.name;
      restyle();
      if (focus) map.fitBounds(d.b, {padding: [30, 30]});
    });

  }
  restyle();
  // ---- the stream filters (map_filter.js), at the top of the layer list, its note under the layer button: the streams
  // under them leave the map, their lines and casings (in lakes too) and their part of the best-water highlight (its
  // pieces known by their ends among the reaches). What comes back is laid in the reaches' order again (the bigger
  // rivers on top) with the style of the moment, under the roads, trails and the long trail (restack).
  if (window.streamFilter) {
    const sets = [lines, lakeLines, halo, lakeHalo].map(g => [g, g.getLayers().map(l => [l, l.feature.properties])]);
    const ends = g => { const c = g.type === "MultiLineString" ? g.coordinates : [g.coordinates], z = c[c.length - 1];
                        return c[0][0] + ";" + z[z.length - 1]; };
    const best = ctrl._layers.find(o => o.overlay && keyOf(o) === "best");
    if (best && best.layer.getLayers) {
      const byEnds = new Map(S.features.map(f => [ends(f.geometry), f.properties]));
      sets.push([best.layer, best.layer.getLayers().map(l => [l, l.feature && byEnds.get(ends(l.feature.geometry))])
                                                     .filter(([, p]) => p)]);
    }
    const note = L.control({position: "topright"});
    note.onAdd = () => { const d = L.DomUtil.create("div"); L.DomEvent.disableClickPropagation(d); return d; };
    note.addTo(map);
    streamFilter.init({features: S.features, section: ctrl._section, note: note.getContainer(), open: () => ctrl.expand(),
      apply(pass) {
        hideHover();
        let back = false;
        sets.forEach(([g, all]) => all.forEach(([l, p]) => {
          const want = !pass || pass(p);
          if (want === g.hasLayer(l)) return;
          if (!want) { g.removeLayer(l); return; }
          g.addLayer(l);
          if (typeof g.options.style === "function") l.setStyle(g.options.style(l.feature));
          back = true;
        }));
        if (back) [lines, lakeLines, halo, lakeHalo].forEach(g => { if (map.hasLayer(g)) g.eachLayer(l => l.bringToFront()); });
        restack();
      }});
  }
  // ---- similar streams (map_specs.js): a popup's "Similar streams" dims the streams unlike its reach and lays a yellow
  // glow under those like it, among the streams the filters keep (in lakes too while the Lakes layer is off); its note
  // goes under the layer button, below the filter's
  const gp = map.createPane("likeglow");
  gp.style.zIndex = 385;                                  // over the white casing, under the streams
  gp.style.pointerEvents = "none";
  const glowR = L.canvas({pane: "likeglow", padding: 0.4});
  function drawGlow() {
    if (likeGlow) { map.removeLayer(likeGlow); likeGlow = null; }
    if (likeTest === null || !map.hasLayer(streams)) return;
    const keep = window.streamFilter && streamFilter.on() ? streamFilter.pass : null;
    const feats = S.features.concat(map.hasLayer(lakeStreams) ? SL.features : [])
      .filter(f => likeTest(f.properties) && (!keep || keep(f.properties)));
    likeGlow = L.geoJSON({type: "FeatureCollection", features: feats}, {style: gstyle, renderer: glowR, interactive: false})
      .addTo(map);
  }
  if (window.streamSpecs) {
    const lnote = L.control({position: "topright"});
    lnote.onAdd = () => { const d = L.DomUtil.create("div"); L.DomEvent.disableClickPropagation(d);
                          L.DomEvent.disableScrollPropagation(d); return d; };
    lnote.addTo(map);
    streamSpecs.init({features: S.features, note: lnote.getContainer(), closePopup: () => map.closePopup(),
      apply(test) { likeTest = test; hideHover(); restyle(); drawGlow(); }});
    document.addEventListener("streamfilter", drawGlow);
    map.on("overlayadd overlayremove", drawGlow);
  }
  // The 3D link opens the 3D map tilted over the current view, with the layers that are on (layer_order.js: layerLink),
  // and the 3D map's link here brings its own. What this page opened with, before a link's list: the overlays by key and
  // the base map.
  const BASE2D = [["gray", /^Light gray/], ["topo", /^USGS Topo/], ["sat", /^Satellite/], ["otm", /^OpenTopoMap/]];
  const baseKey = o => (BASE2D.find(([, re]) => re.test(o.name)) || [""])[0];
  const overlays = () => ctrl._layers.filter(o => o.overlay && keyOf(o));
  const bases = () => ctrl._layers.filter(o => !o.overlay && baseKey(o));
  const baseNow = () => { const b = bases().find(o => map.hasLayer(o.layer)); return b ? baseKey(b) : ""; };
  const opened = new Map(overlays().map(o => [keyOf(o), map.hasLayer(o.layer)])), openedBase = baseNow();
  // a link's list: this page's layers as it says (twice over: the trails bring their bike colouring when they come on)
  // and its base map if this page has it; the rest is kept for the link back
  const came = layerLink.parse(location.hash);
  const keep = {on: [...came.on].filter(k => !opened.has(k)), off: [...came.off].filter(k => !opened.has(k)),
                base: bases().some(o => baseKey(o) === came.base) ? "" : came.base};
  if (came.on.size || came.off.size)
    for (let pass = 0; pass < 2; pass++) overlays().forEach(o => {
      const k = keyOf(o), on = came.on.has(k) || (!came.off.has(k) && opened.get(k));
      if (on !== map.hasLayer(o.layer)) { if (on) map.addLayer(o.layer); else map.removeLayer(o.layer); }
    });
  const nb = came.base && bases().find(o => baseKey(o) === came.base);
  if (nb && !map.hasLayer(nb.layer)) { bases().forEach(o => map.removeLayer(o.layer)); map.addLayer(nb.layer); }
  map.on("baselayerchange", () => { keep.base = ""; });     // a base map picked here goes in the link back instead
  const layerPart = () => {
    const on = new Set(keep.on), off = new Set(keep.off), b = baseNow();
    overlays().forEach(o => { const k = keyOf(o), now = map.hasLayer(o.layer);
      if (now && !opened.get(k)) on.add(k); else if (!now && opened.get(k)) off.add(k); });
    return layerLink.part(on, off, b !== openedBase ? b : keep.base);
  };
  const to3d = box.querySelector(".to3d");
  const sync3d = () => { const c = map.getCenter();
    to3d.href = `stream_map_3d.html#${c.lat.toFixed(5)},${c.lng.toFixed(5)},${map.getZoom()},55` + layerPart() +
      (window.streamFilter ? streamFilter.part() : "") +            // and the stream filter (map_filter.js)
      (window.streamSpecs ? streamSpecs.part() : ""); };            // and the similar streams (map_specs.js)
  map.on("moveend overlayadd overlayremove baselayerchange", sync3d);
  document.addEventListener("streamfilter", sync3d);
  document.addEventListener("streamlike", sync3d);
  to3d.addEventListener("click", sync3d);
  // "Go to": another area's map, or the map of all areas at this view
  const asel = box.querySelector(".areasel");
  if (asel) asel.onchange = () => { const c = map.getCenter();
    if (asel.value === "*") location.href = `../index.html#${c.lat.toFixed(4)},${c.lng.toFixed(4)},${Math.min(map.getZoom(), 10)}`;
    else if (asel.value) location.href = `../${asel.value}/stream_map.html`; };

  // The spot being looked at in the creek profile viewer (profiles.html), shown by a ring on the creek. That page
  // sends it while the mouse is over the profile ("hover": the ring follows, the map only pans to keep it in view)
  // and when a spot is clicked ("pick": the map goes there). It also comes in a link, as #lat,lon,zoom,pin.
  // BroadcastChannel reaches the other tabs of the site; the localStorage copy does the same for pages opened from
  // disk, where some browsers keep the channel to one page. Areas ignore spots outside their own range.
  const pp = map.createPane("profpin");
  pp.style.zIndex = 660; pp.style.pointerEvents = "none";
  const pin = L.layerGroup([
    L.circleMarker([0, 0], {pane: "profpin", radius: 11, color: "#fff", weight: 5, opacity: 0.9, fill: false, interactive: false}),
    L.circleMarker([0, 0], {pane: "profpin", radius: 11, color: "#2a78d6", weight: 2.5, fill: true, fillColor: "#2a78d6",
                            fillOpacity: 0.15, interactive: false}),
    L.circleMarker([0, 0], {pane: "profpin", radius: 2.5, color: "#2a78d6", weight: 0, fill: true, fillOpacity: 1, interactive: false}),
  ]);
  const pinTip = L.tooltip({pane: "profpin", permanent: true, direction: "right", offset: [14, 0], className: "profpin-tip"});
  const areaBounds = L.geoJSON(window.DIVIDES).getBounds().pad(0.05);
  let lastSeq = -1;
  // the label's × takes the ring off (it comes back with the next spot sent from the profile), and drops a ",pin"
  // link's marker from the address so a reload doesn't bring it back
  function hidePin() {
    map.removeLayer(pin); map.removeLayer(pinTip);
    const [view, ...rest] = location.hash.slice(1).split("&"), parts = view.split(",");     // rest: the layers (layerLink)
    if (parts[3] === "pin") history.replaceState(null, "", "#" + [parts.slice(0, 3).join(","), ...rest].join("&"));
  }
  function showPin(m) {
    if (!m || m.seq === lastSeq || !isFinite(m.lat) || !isFinite(m.lon)) return;
    lastSeq = m.seq;
    const ll = L.latLng(m.lat, m.lon);
    if (!areaBounds.contains(ll)) return;
    pin.eachLayer(l => l.setLatLng(ll));
    if (!map.hasLayer(pin)) pin.addTo(map);
    pinTip.setLatLng(ll).setContent(`<span>${esc(m.text || "Profile spot")}</span>` +
      `<button type="button" class="profpin-x" title="Remove this marker" aria-label="Remove this marker">×</button>`);
    if (!map.hasLayer(pinTip)) {
      pinTip.addTo(map);
      const el = pinTip.getElement();
      if (!el._pinWired) {          // the tooltip keeps its element between shows: wire it once
        el._pinWired = true;
        L.DomEvent.disableClickPropagation(el);
        L.DomEvent.on(el, "click", e => { if (e.target.closest(".profpin-x")) { L.DomEvent.stop(e); hidePin(); } });
      }

    <script>// Cell coverage on the map pages (the user, 2026-11-25, a feature of onWater's: where each carrier has signal, to know

      do { b = str.charCodeAt(i++) - 63; r |= (b & 31) << sh; sh += 5; } while (b >= 32);

<script>// The trout calendar in the stream popups: when in the year a reach fishes best, by half-month, under the fish score
// (which stays as it is: the score says where, the calendar when). Fishing conditions only, no legal seasons. 06_map.py
// puts this file at the end of both area maps (stream_map.html, stream_map_3d.html), after map_score.js: it adds its
// line to the fish score's (fsRow), so the popups themselves are unchanged. troutcal.py says what the calendar is and
// does the same sum in Python (calendar()): water temperature x flow x light x ice x clarity x oxygen x hatches. This
// file works it out from the reach's fx (its summer water temperature, tree canopy, water term and flags, as
// map_score.js reads them), a (drainage, km2), el (m), x/y and cz (its horizon at the area's bearings, then its time
// zone where it isn't the map's), with the area's tables in LBL.cal (11b_calendar.py's calendar.json).
// A row of 24 half-months, darker = better; a tap on one gives its reasons. window.troutCal serves the maps' "When"
// choice in the fish score colours: the fish score scaled by how a half-month rates on each creek.
(function () {
  const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
  const CH = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz-_";
  const MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  const LAST = [31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
  const rad = d => d * Math.PI / 180, deg = r => r * 180 / Math.PI;
  const degf = c => Math.round(c * 9 / 5 + 32) + " °F";        // units.py's degf
  const tab = () => { const L = window.LBL || (window.MAP3D || {}).lbl || {}; return L.cal || null; };
  const lin = (pts, x) => {
    if (x <= pts[0][0]) return pts[0][1];
    for (let i = 1; i < pts.length; i++) {
      const [x0, y0] = pts[i - 1], [x1, y1] = pts[i];
      if (x <= x1) return y0 + (y1 - y0) * (x - x0) / (x1 - x0);

  };
  const midDate = (h, y) => [y, Math.floor(h / 2), h % 2 ? 23 : 8];            // year, month (0-11), day
  const dst = (y, m, d) => {     // US daylight saving time: 2nd Sunday in March to 1st Sunday in November
    const t = Date.UTC(y, m, d), a = new Date(Date.UTC(y, 2, 1)), b = new Date(Date.UTC(y, 10, 1));
    const a2 = Date.UTC(y, 2, 1 + (7 - a.getUTCDay()) % 7 + 7), b1 = Date.UTC(y, 10, 1 + (7 - b.getUTCDay()) % 7);
    return a2 <= t && t < b1;
  };
  // dissolved oxygen at saturation (mg/L) at T C and el m: troutcal.do_sat()
  const doSat = (Tc, el) => { const K = Tc + 273.15;
    const ln = -139.34411 + 1.575701e5 / K - 6.642308e7 / K ** 2 + 1.2438e10 / K ** 3 - 8.621949e11 / K ** 4;
    return Math.exp(ln) * Math.exp(-Math.max(el, 0.0) / 8434.0); };

  // the sun on half-month h's middle day at a latitude rounded to 0.1 deg: troutcal.sun_path()
  const paths = {};
  function sunPath(T, h, lat) {
    const la = Math.floor(lat * 10 + 0.5) / 10, key = h + "|" + la;
    if (paths[key]) return paths[key];
    const [y, m, d] = midDate(h, T.year);
    const n = (Date.UTC(y, m, d) - Date.UTC(y, 0, 1)) / 864e5 + 1;
    const g = 2 * Math.PI / 365 * (n - 1);
    const eot = 229.18 * (0.000075 + 0.001868 * Math.cos(g) - 0.032077 * Math.sin(g) - 0.014615 * Math.cos(2 * g)
                          - 0.040849 * Math.sin(2 * g));
    const dec = 0.006918 - 0.399912 * Math.cos(g) + 0.070257 * Math.sin(g) - 0.006758 * Math.cos(2 * g)
                + 0.000907 * Math.sin(2 * g) - 0.002697 * Math.cos(3 * g) + 0.00148 * Math.sin(3 * g);
    const phi = rad(la), st = T.step, steps = [];
    for (let i = 0; i < 24 * 60; i += st) {
      const t = i / 60 + st / 120, ha = rad((t - 12) * 15);
      const alt = deg(Math.asin(Math.sin(phi) * Math.sin(dec) + Math.cos(phi) * Math.cos(dec) * Math.cos(ha)));
      if (alt <= 0) continue;
      const az = ((deg(Math.atan2(Math.sin(ha), Math.cos(ha) * Math.sin(phi) - Math.tan(dec) * Math.cos(phi))) + 180) % 360 + 360) % 360;
      steps.push([i + st / 2, alt, az]);
    }
    return paths[key] = {steps, up: steps.length, eot, dst: dst(y, m, d)};
  }
  // hours of direct sun on the water, its first and last minute (local clock), the day's length: troutcal.sun_day()
  function sunDay(T, h, lat, lon, hz, tz, useDst) {
    const P = sunPath(T, h, lat), AZ = T.az, pts = AZ.map((a, i) => [a, hz[i]]);
    let lit = 0, first = null, last = null;
    for (const [mm, alt, az] of P.steps) {
      const hv = az <= AZ[0] ? hz[0] : az >= AZ[AZ.length - 1] ? hz[hz.length - 1] : lin(pts, az);
      if (alt > hv) { lit++; if (first === null) first = mm; last = mm; }
    }
    const clock = m2 => m2 === null ? null : m2 - P.eot - 4 * (lon - 15 * tz) + (useDst && P.dst ? 60 : 0);
    return [lit * T.step / 60, clock(first), clock(last), P.up * T.step / 60];
  }

  // what the sum reads off a reach (troutcal.prep()), or null; kept per reach
  const preps = new WeakMap();
  function prep(T, p) {
    if (preps.has(p)) return preps.get(p);
    let r = null;
    const n = T.az.length, t = String(p.fx || "").split(" ");
    const num = v => v === undefined || v === "" || v === "-" ? null : Number(v);
    if (typeof p.cz === "string" && p.cz.length >= n && t.length >= 8) {
      const flags = t.slice(8), tw = flags.includes("w"), wt = num(t[2]), cp = num(t[3]);
      if (wt !== null || tw) {
        const la = Math.log10(Math.max(p.a, 0.01));
        let wsum = 0, isum = 0;
        const acc = new Array(24).fill(0), iacc = new Array(24).fill(0);
        T.gauges.forEach(g => {
          const dkm = 111.2 * Math.hypot(p.y - g[1], (p.x - g[2]) * Math.cos(rad(p.y)));
          const w = Math.exp(-0.5 * ((la - g[0]) / T.sig[0]) ** 2 - 0.5 * (dkm / T.sig[1]) ** 2);
          wsum += w;
          for (let h = 0; h < 24; h++) acc[h] += w * Math.log10(g[3][h]);
          if (g[5] != null) { isum += w; for (let h = 0; h < 24; h++) iacc[h] += w * g[5][h]; }
        });
        r = {W: num(t[0]), wt, cp, tw, brook: flags.includes("b"), canopy: Math.min(Math.max((cp || 0) / 100, 0), 1),
             hz: [...p.cz.slice(0, n)].map(ch => CH.indexOf(ch)), tz: p.cz.length > n ? CH.indexOf(p.cz[n]) - 12 : T.tz,
             el: p.el || 0.0, lr: acc.map(a => wsum > 0 ? a / wsum : 0), ice: iacc.map(a => isum > 0 ? a / isum : 0)};
      }
    }
    preps.set(p, r);
    return r;
  }
  // one half-month (troutcal.half())
  function half(T, P, p, h) {
    const ws = T.water, base = P.wt === null ? ws.S : P.wt;
    let Tw = Math.max(0.5, ws.S + ws.d[h] + ws.k[h] * (base - ws.S));
    if (P.tw) Tw = Math.min(Math.max(Tw, T.tail[0]), T.tail[1]);
    const sT = lin(T.thermal[P.brook ? "brook" : "trout"], Tw);
    // a tailwater's flow is the dam's; a creek year-round by its own evidence takes no low-water mark (troutcal.half())
    const lr = P.lr[h], yr = P.W !== null && P.W >= T.year_round, sQ = P.tw || (lr < 0 && yr) ? 1.0 : lin(T.flow, lr);
    const dry = P.W !== null && h >= T.dry[0] && h < T.dry[1] ? Math.min(1.0, P.W / T.year_round) : 1.0;
    const [sun, first, last, day] = sunDay(T, h, p.y, p.x, P.hz, P.tz, T.dst);
    const e = (day > 0 ? sun / day : 0.0) * (1 - 0.8 * P.canopy);
    const warm = 1 - 0.30 * e, cold = 0.85 + 0.15 * e;
    const f = Math.min(Math.max((Tw - T.light[1]) / (T.light[0] - T.light[1]), 0), 1);
    const sL = cold + (warm - cold) * f;
    const ice = P.ice[h], sI = 1 - T.ice_k * ice;
    const ntu = T.clarity.ntu[h], sC = ntu === null ? 1.0 : lin(T.clar, ntu);
    const sat = T.oxygen.sat[h], dox = sat === null ? null : doSat(Tw, P.el) * sat, sO = dox === null ? 1.0 : lin(T.oxy, dox);
    const rel = T.hatch.rel[h], sB = rel === null ? 1.0 : T.hatch_lo + (1 - T.hatch_lo) * Math.min(Math.max(rel, 0.0), 1.0);
    const x = 100 * sT * sQ * dry * sL * sI * sC * sO * sB;
    return {h, T: Tw, sT, ratio: 10 ** lr, sQ, dry, yr, sun, first, last, day, e, sL, ice, sI, ntu, sC, dox, sO, rel, sB,
            score: Math.floor(x + 0.5), brook: P.brook, tw: P.tw, cp: P.cp};
  }
  // the 24 half-months of a reach (troutcal.calendar()), or null
  function calendar(p) {
    const T = tab(), P = T && p ? prep(T, p) : null;
    if (!P) return null;
    const out = [];
    for (let h = 0; h < 24; h++) out.push(half(T, P, p, h));
    return out;
  }
  // one half-month's score, for the map's colours (kept per reach); null where the reach has no calendar
  function score(p, h) {
    const T = tab(), P = T && p ? prep(T, p) : null;
    if (!P) return null;
    P.sc = P.sc || {};
    return h in P.sc ? P.sc[h] : P.sc[h] = half(T, P, p, h).score;
  }

  // ---- words ----
  const CLS = [[75, "best", "q4"], [55, "good", "q3"], [35, "fair", "q2"], [15, "poor", "q1"], [-1, "bad", "q0"]];
  const cls = c => CLS.find(k => c.score >= k[0]).slice(1);
  const hStart = h => `${MON[h >> 1]} ${h % 2 ? 16 : 1}`, hEnd = h => `${MON[h >> 1]} ${h % 2 ? LAST[h >> 1] : 15}`;
  const hName = h => `${hStart(h)}–${h % 2 ? LAST[h >> 1] : 15}`;
  // a run of half-months in words: whole months by name ("May", "Sep – Oct"), else its dates
  const span = (a, b) => a === b ? hName(a) : a % 2 === 0 && b % 2 === 1
    ? (a >> 1 === b >> 1 ? MON[a >> 1] : `${MON[a >> 1]} – ${MON[b >> 1]}`) : `${hStart(a)} – ${hEnd(b)}`;
  const clock = m => { if (m === null) return "";
    m = ((Math.round(m / 10) * 10) % 1440 + 1440) % 1440; const H = Math.floor(m / 60), M = m % 60;
    return `${(H + 11) % 12 + 1}:${String(M).padStart(2, "0")} ${H < 12 ? "am" : "pm"}`; };
  const now = () => { const d = new Date(); return d.getMonth() * 2 + (d.getDate() > 15 ? 1 : 0); };

  // what holds a half-month down: [key, words], the lowest part (none where every part is 0.97 or more)
  function why(c) {
    const q = c.sQ * c.dry, parts = [["water", c.sT], ["flow", q], ["light", c.sL], ["ice", c.sI], ["clarity", c.sC],
                                     ["oxygen", c.sO], ["hatch", c.sB]];
    const [k, m] = parts.reduce((a, b) => b[1] < a[1] ? b : a);
    if (m >= 0.97) return ["", ""];
    if (k === "water") return c.T < 10 ? (c.T <= 1.5 ? ["icecold", "near-freezing water"] : ["cold", "cold water"]) : ["warm", "warm water"];
    if (k === "flow") return c.dry < c.sQ ? ["dry", "may run dry"] : c.ratio > 1 ? ["runoff", "runoff"] : ["low", "very low water"];
    if (k === "light") return c.T >= 12 ? ["sun", "bright sun on open water"] : ["shade", "no sun on the water"];
    return {ice: ["ice", "ice"], clarity: ["murky", "murky water"], oxygen: ["oxygen", "low oxygen"], hatch: ["hatch", "few insects hatching"]}[k];
  }
  // runs of half-months (round the year) where test holds: [[first, last], ...] in calendar order
  function runs(cal, test) {
    const on = cal.map(test);
    if (on.every(Boolean)) return [[0, 23]];
    if (!on.some(Boolean)) return [];
    const out = [], s = on.findIndex(v => !v);
    for (let i = 1; i <= 24; i++) {
      const h = (s + i) % 24;
      if (on[h] && !on[(h + 23) % 24]) out.push([h, h]);
      if (on[h]) out[out.length - 1][1] = h;
    }
    return out.sort((a, b) => a[0] - b[0]);
  }
  const hsOf = ([a, b]) => { const hs = []; for (let h = a; ; h = (h + 1) % 24) { hs.push(h); if (h === b) break; } return hs; };
  const water = c => {
    const t = c.T, sp = c.brook ? "brook trout" : "trout", best = c.brook ? "50–61" : "50–64";
    const w = c.tw ? "a tailwater, held cool by the dam" : t <= 1.5 ? "near freezing: trout barely feed"
      : t < 7 ? "cold: trout sluggish" : t < 10 ? "cool, warming fish up" : c.sT >= 0.999 ? `ideal for ${sp}`
      : t > (c.brook ? 18 : 20) ? `too warm for ${sp} (best ${best} °F)` : `warm for ${sp} (best ${best} °F)`;
    return `Water about ${degf(t)}, ${w}` + (c.ice >= 0.05 ? `; ice on about ${Math.round(c.ice * 100)}% of days` : "");
  };
  const flowWords = c => {
    if (c.dry < 1) return "may run dry: it flows only in some summers";
    if (c.tw) return "flow set by the dam's releases";
    const r = c.ratio, x = r >= 2 ? `${r >= 10 ? Math.round(r) : r.toFixed(1)}×` : r <= 0.25 ? `${r.toFixed(r < 0.1 ? 2 : 1)}×` : "";
    return (r >= 3.5 ? "runoff, high water" : r >= 2 ? "high water" : r <= 0.25 && c.yr ? "summer low flow"
      : r <= 0.05 ? "very low water" : r <= 0.25 ? "low water" : "normal flow") + (x ? ` (about ${x} its typical day)` : "");
  };
  const clarWords = c => c.ntu === null ? "" : (c.ntu < 5 ? "clear" : c.ntu < 10 ? "slightly stained" : c.ntu < 25 ? "stained"
    : c.ntu < 50 ? "murky" : "muddy") + ` (typical ${c.ntu < 10 ? c.ntu.toFixed(1) : Math.round(c.ntu)} NTU)`;
  const oxyWords = c => c.dox === null ? "" : `oxygen about ${Math.round(c.dox)} mg/L${c.dox < 6 ? ", low for trout" : ""}`;
  const hatchWords = c => c.rel === null ? "" : c.rel >= 1.2 ? "many insects hatching" : c.rel >= 0.8 ? "insects hatching"
    : c.rel >= 0.4 ? "some insects hatching" : "few insects hatching";
  const sunWords = c => (c.sun >= 0.5 ? `Sun on the water ${clock(c.first)}–${clock(c.last)}` : "No direct sun on the water (terrain)")
    + (c.cp >= 30 ? ` (${Math.round(c.cp)}% tree cover)` : "");
  const todWords = c => c.T >= 18 ? "fish early morning and evening, when it is coolest"
    : c.T <= 9 ? "fish late morning into the afternoon, when it is warmest"
    : c.e >= 0.45 ? "best in low light: early, late or on a cloudy day" : "good all day";

  // g: the USGS gauge on the reach's creek (06_map.py: p.g); under "now" its latest reading, beside the flow's note
  // (map_gauges.js fills the line when the popup opens)
  function detail(cal, h, nowH, g) {
    const c = cal[h], [, w] = why(c), [lab] = cls(c);
    const line = xs => { const s = xs.filter(Boolean).map(esc).join(" · "); return s && s[0].toUpperCase() + s.slice(1); };
    return `<b>${h === nowH ? "Now, " : ""}${hName(h)}</b>: ${lab} (${c.score})` + (w ? ` · ${w}` : "") +
      `<div>${line([water(c), flowWords(c)])}</div>` +
      (h === nowH && g && window.gaugeLive ? `<div class="glc" data-gauge-now="${esc(g)}"></div>` : "") +
      `<div>${line([clarWords(c), oxyWords(c), hatchWords(c)])}</div>` +
      `<div>${esc(sunWords(c))} · <i>${esc(todWords(c))}</i></div>` +
      `<div class="cdm calk">Darker = better · tap a half-month · conditions only, not legal seasons</div>`;
  }

  // the "Best" line and the worst stretches, with their reason
  function summary(cal) {
    const top = Math.max(...cal.map(c => c.score)), cut = Math.max(top - 10, 15);
    const best = runs(cal, c => c.score >= cut).map(([a, b]) => span(a, b)).join(", ");
    const at = top >= 55 ? "" : top >= 35 ? " (fair at best)" : " (poor all year)";
    const word = {icecold: "near-freezing water", cold: "cold water", warm: "warm water", runoff: "runoff", low: "very low water",
                  dry: "may run dry", sun: "bright open water", shade: "no sun on the water", ice: "ice", murky: "murky water",
                  oxygen: "low oxygen", hatch: "few insects hatching", "": "several reasons"};
    const say = r => {
      const hs = hsOf(r), n = {};
      hs.forEach(h => { const k = why(cal[h])[0]; n[k] = (n[k] || 0) + 1; });
      const key = Object.keys(n).sort((x, y) => n[y] - n[x])[0], ts = hs.map(h => cal[h].T), ice = Math.max(...hs.map(h => cal[h].ice));
      const val = key === "warm" ? `, up to ${degf(Math.max(...ts))}` : key === "cold" || key === "icecold"
        ? `, ${degf(Math.min(...ts))}` + (ice >= 0.1 ? `, ice on up to ${Math.round(ice * 100)}% of days` : "")
        : key === "runoff" ? `, ${Math.round(Math.max(...hs.map(h => cal[h].ratio)) * 10) / 10}× its typical day`
        : key === "ice" ? `, ${Math.round(Math.max(...hs.map(h => cal[h].ice)) * 100)}% of days` : "";

    if (!worst.length) {
      const bot = Math.min(...cal.map(c => c.score));
      worst = runs(cal, c => c.score <= bot + 5).map(say).sort((a, b) => b[0] - a[0]).slice(0, 1).map(x => x[1]);

  let seq = 0;

    kept[key] = {cal, nowH, g: p.g};
    const cells = cal.map(c => { const [lab, q] = cls(c);
      return `<i class="${q}${c.h === nowH ? " now sel" : ""}" title="${hName(c.h)}: ${lab} ${c.score}"></i>`; }).join("");
    const [best, worst] = summary(cal);
    return `<tr class="calr"><td colspan="2" class="calc"><div class="calh"><span class="calt">Best time</span> ${best}</div>` +
      `<div class="cal" data-k="${key}" onclick="calTap(event,this)"><div class="cals">${cells}</div>` +
      `<div class="calm">${MON.map(m => `<span>${m[0]}</span>`).join("")}</div></div>` +
      (worst ? `<div class="calw"><span class="calt">Worst</span> ${worst}</div>` : "") +
      `<div class="cald">${detail(cal, nowH, nowH, p.g)}</div></td></tr>`;
  };
  // a tap on the row: the half-month under the finger, its reasons below. The calendar is marked as tapped and the
  // pages re-place the popup ("fs-toggle"): on a phone they keep it in view whole, as they do the fish score's open
  // breakdown, the legend folded while it is in the way (map_phone.js, map3d.html)
  window.calTap = (ev, el) => {
    const k = kept[el.dataset.k], strip = el.querySelector(".cals");
    if (!k || !strip) return;
    const r = strip.getBoundingClientRect(), h = Math.min(23, Math.max(0, Math.floor((ev.clientX - r.left) / r.width * 24)));
    strip.querySelectorAll("i").forEach((c, i) => c.classList.toggle("sel", i === h));
    const box = el.parentNode.querySelector(".cald");
    if (box) { box.innerHTML = detail(k.cal, h, k.nowH, k.g); if (window.gaugeLive) gaugeLive.fill(box); }
    el.parentNode.classList.add("tapped");
    ev.stopPropagation();
    document.dispatchEvent(new CustomEvent("fs-toggle", {detail: el}));
  };
  // the calendar's line follows the fish score's in every stream popup (map_score.js's fsRow), on any page that has
  // the area's tables
  if (typeof window.fsRow === "function" && !window.fsRow.cal) {
    const fs0 = window.fsRow;
    window.fsRow = p => fs0(p) + (tab() ? window.calRow(p) : "");
    window.fsRow.cal = true;
  }
  // the maps' "When" choice: the fish score scaled by how half-month h rates on the creek (null: no calendar here)
  window.troutCal = {calendar, score, name: hName, now,
                     fishIn: (p, h) => { const s = score(p, h); return s === null ? null : Math.round(p.fs * s / 100); },
                     ready: () => !!tab()};

  if (typeof document !== "undefined" && !document.getElementById("cal-style")) {
    const st = document.createElement("style");
    st.id = "cal-style";
    // 5 ordinal steps of one blue ramp (light = worse)
    st.textContent = ".pp td.calc.calc{white-space:normal;color:#1d1d1f;padding:5px 0 3px;border-top:1px solid #e3e7ec;" +
      "border-bottom:1px solid #e3e7ec}.calt{color:#6b7280;margin-right:3px}.calh,.calw{line-height:1.35}.calw{margin-top:2px}" +
      ".cal{margin:4px 0 1px;cursor:pointer;-webkit-tap-highlight-color:transparent}" +
      ".cals{display:grid;grid-template-columns:repeat(24,1fr);gap:1px}.cals i{height:16px;border-radius:2px;position:relative}" +
      ".cals i.sel{box-shadow:0 0 0 1.5px #fff,0 0 0 3px #1d1d1f;z-index:1}" +
      ".cals i.now::after{content:'';position:absolute;left:50%;bottom:2px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:#fff}" +
      ".calm{display:grid;grid-template-columns:repeat(12,1fr);font-size:10px;color:#6b7280;text-align:center;margin-top:1px}" +
      ".q4{background:#104281}.q3{background:#1c5cab}.q2{background:#2a78d6}.q1{background:#5598e7}.q0{background:#86b6ef}" +
      ".cald{margin-top:4px;padding:4px 6px;background:#f4f6f8;border-radius:6px;line-height:1.35}" +
      ".pp .cald b{font-size:12px}.cdm{color:#6b7280}.calk{font-size:10.5px;margin-top:1px}" +
      // the "When" choice under the fish score's colour key (map_drainages.js, map3d.html)
      ".calwhen{display:flex;align-items:center;gap:6px;margin:5px 0 3px;font-size:12px;color:#1d1d1f}" +
      ".calwhen select{font:inherit;font-size:12px;flex:1;min-width:0;border:1px solid #c9ced6;border-radius:5px;" +
      "background:#fff;color:#1d1d1f;padding:2px 3px}";
    document.head.appendChild(st);
  }
})();
</script>
