<!DOCTYPE html>
<html>
<head>
    
    <meta http-equiv="content-type" content="text/html; charset=UTF-8" />
    <script src="../lib/streams/load.js"></script>
    <script>// Stream filters at the top of the area maps' "View & layers" panels (the user, 2026-11-24: "add the ability to filter
// by stream order/size and fish score"; asked, they chose a minimum fish score, not a range, and the drainage area for
// the size, not the stream order). The fish score has a slider with one thumb, the least score shown. The drainage has
// one with two thumbs, the least and the most drainage shown (the user, 2026-11-25: "i want to be able to filter out
// big streams and small streams not just filter out the smaller ones"). The streams outside them, by the fish score and
// drainage their popups show, leave the map (their lines, casings and names; on the 2D map their part of the best-water
// highlight too); everything else, the popups of the streams still shown included, works as before. The maps open
// unfiltered. The filter goes along with the switch between the 2D and 3D maps in the link, after the layers
// (layer_order.js: layerLink), as "&fish=60&sqmi=5-25" ("&sqmi=5": 5 sq mi or more, "&sqmi=0-25": 25 or less), and is
// read when the page opens, as the layers are. While it is on, a note by the layer panel says so ("Streams filtered:
// fish score 60+, drainage 5–25 sq mi" and the miles still shown, with a × that shows them all again), so a filtered map
// isn't taken for a sparse one.
// The trout species (the user, 2026-11-25, after onWater's species layers): a choice of the species this map's data
// names (any, brook, brown, rainbow, cutthroat, lake trout: only those some stream here has), which keeps the streams
// with evidence of it: a trout record naming it (a survey, a stocking, an iNaturalist sighting) or a designated water
// naming it (a wild brook trout patch, a state's brook trout or cutthroat waters, a stream listed with it). "Recorded
// only" leaves out the streams only designated for it. Each reach carries its species as "sp" (06_map.py, from
// 11_context.py and troutspecies.py: B brook, N brown, R rainbow, C cutthroat, L lake trout; a capital where a record
// names it, with the latest year, "B2018", the small letter where a designation does); the popups' "Species" line
// says which, for each ("brook trout: recorded 2018, designated"). In the link: "&trout=brook", "&trout=brook-recorded".
// The mean annual flow (the user, 2026-11-25, after the r/bluelining thread whose anglers like 3-15 cfs blue lines): a
// second two-thumb slider like the drainage's, in cfs (any, 0.5, 1, 3, 5, 10, 15, 25, 50, 100, any), on the flow the
// popups' specs line shows ("q", map_specs.js / streamspecs.py). A stream with no flow estimate can't be placed, so it
// leaves the map while a flow limit is set, and the slider says so. In the link: "&cfs=3-15" ("&cfs=3", "&cfs=0-15").
// Shown only where the reaches carry q.
// Shared by map_drainages.js (2D) and map3d.html (3D), inlined by 06_map.py: each page says where the sliders and the
// note go and how it hides a stream (init below). Its styles are its own (the end of this file).
window.streamFilter = (function () {
  const FISH = [0, 100, 5];                              // the fish score slider: from, to, step (0: any)
  // the two-thumb sliders: the drainage (sq mi) and the mean annual flow (cfs). Each: its steps (0: any), the state's
  // keys for its least and most, its name, and its unit. Its last place, past the last step: no most
  const RANGES = {
    sqmi: {steps: [0, 0.5, 1, 2, 5, 10, 25, 50, 100], lo: "sqmi", hi: "sqmax", name: "Drainage", unit: "sq mi"},
    cfs: {steps: [0, 0.5, 1, 3, 5, 10, 15, 25, 50, 100], lo: "cfs", hi: "cfsmax", name: "Mean flow", unit: "cfs"}};
  const TOP = k => RANGES[k].steps.length;
  const KM2 = 2.589988;                                  // km² in a sq mi: the reaches carry km² (06_map.py "a")
  const THUMB = 26;                                      // the sliders' thumb, px (the tick labels sit under its centre)
  // the trout species, in the order shown (troutspecies.py): the reaches' code letter, the name, the button's word
  const SPECIES = [["brook", "B", "brook trout", "Brook"], ["brown", "N", "brown trout", "Brown"],
                   ["rainbow", "R", "rainbow trout", "Rainbow"], ["cutthroat", "C", "cutthroat trout", "Cutthroat"],
                   ["lake", "L", "lake trout", "Lake trout"]];
  const SPC = Object.fromEntries(SPECIES.map(([k, c]) => [k, c])), SPN = Object.fromEntries(SPECIES.map(([k, , n]) => [k, n]));
  const st = {fish: 0, sqmi: 0, sqmax: 0, cfs: 0, cfsmax: 0, sp: "", rec: false};   // 0 or "": no limit
  const NONE = {fish: 0, sqmi: 0, sqmax: 0, cfs: 0, cfsmax: 0, sp: "", rec: false};
  let o = null, el = null, note = null, miles = null, timer = 0, applied = "", have = [], hasFlow = false;

  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
  const on = () => !!(st.fish || st.sqmi || st.sqmax || st.cfs || st.cfsmax || st.sp);
  // a reach has the chosen species: a record names it (the capital) or, unless "recorded only", a designation (small)
  const recorded = (p, k) => (p.sp || "").includes(SPC[k]);
  const hasSp = (p, k) => recorded(p, k) || (p.sp || "").includes(SPC[k].toLowerCase());
  // A reach passes "at least t sq mi" when its popup shows t or more, and "at most t sq mi" when it shows t or less: the
  // popups round to 0.01 sq mi under 1, to 0.1 from 1 and to 1 from 100 (map_drainages.js and map3d.html: SQMI), so the
  // least drainage kept is half a rounding step below t, and the most half a step above it
  const minKm2 = t => t ? (t - (t <= 1 ? 0.005 : 0.05)) * KM2 : 0;
  const maxKm2 = t => (t + (t < 1 ? 0.005 : t < 100 ? 0.05 : 0.5)) * KM2;
  // the flow: the popups show it as 06_map.py rounds it (whole cfs from 10, tenths from 1, hundredths under 1), so the
  // reach's q is compared as it is; one with no flow estimate passes no flow limit
  const hasQ = p => p.q !== undefined && p.q !== null;
  const pass = p => (!st.fish || p.fs >= st.fish) && (!st.sqmi || (p.a || 0) >= minKm2(st.sqmi)) &&
                    (!st.sqmax || (p.a || 0) < maxKm2(st.sqmax)) &&
                    (!st.cfs || (hasQ(p) && p.q >= st.cfs)) && (!st.cfsmax || (hasQ(p) && p.q <= st.cfsmax)) &&
                    (!st.sp || (st.rec ? recorded(p, st.sp) : hasSp(p, st.sp)));
  // (a number keeps its unit on its line: \u00a0, a space no line breaks at)
  const rangeWords = k => { const R = RANGES[k], a = st[R.lo], b = st[R.hi], u = "\u00a0" + R.unit.replace(" ", "\u00a0");
    return a && b ? `${a}–${b}${u}` : a ? `${a}+${u}` : b ? `up to ${b}${u}` : ""; };
  const sizeWords = () => rangeWords("sqmi");
  const spWords = () => st.sp ? SPN[st.sp] + (st.rec ? " (recorded)" : "") : "";
  const words = () => [st.fish ? `fish score ${st.fish}+` : "", sizeWords() && `drainage ${sizeWords()}`,
                        rangeWords("cfs") && `mean flow ${rangeWords("cfs")}`, spWords()]
    .filter(Boolean).join(", ");
  // a two-thumb slider's thumbs as places on its track: the least (0: none) and the most (its TOP: none)
  const places = k => { const R = RANGES[k];
    return [R.steps.indexOf(st[R.lo]), st[R.hi] ? R.steps.indexOf(st[R.hi]) : TOP(k)]; };
  const at = (i, max) => `calc(${THUMB / 2}px + (100% - ${THUMB}px) * ${i / max})`;      // a place on a slider's track

  // "#view&on=..&fish=60&sqmi=5-25&cfs=3-15&trout=brook-recorded" -> the filter. A value off the sliders' steps takes the step
  // that shows more: a least the step at or under it, a most the step at or over it (none past 100); a most not over the
  // least is left out; a species this map has no stream with is left out too (init)
  function parse(hash) {
    const r = Object.assign({}, NONE);
    String(hash || "").replace(/^#/, "").split("&").slice(1).forEach(p => {
      const i = p.indexOf("="), k = p.slice(0, i), v = p.slice(i + 1);
      if (k === "fish") {
        const f = parseFloat(v);
        if (f > 0) r.fish = Math.min(FISH[1], Math.floor(f / FISH[2]) * FISH[2]);
      } else if (RANGES[k]) {
        const R = RANGES[k], [lo, hi] = v.split("-").map(x => parseFloat(x));
        if (lo > 0) r[R.lo] = R.steps.filter(s => s <= lo).pop();
        if (hi > 0) r[R.hi] = R.steps.find(s => s >= hi) || 0;
      } else if (k === "trout") {
        let w = v;
        try { w = decodeURIComponent(v); } catch (_) {}      // a broken %-escape: the value as it is
        const [sp, how] = w.toLowerCase().split("-");
        if (SPC[sp]) { r.sp = sp; r.rec = how === "recorded"; }
      }
    });
    Object.values(RANGES).forEach(R => { if (r[R.hi] && r[R.hi] <= r[R.lo]) r[R.hi] = 0; });
    return r;
  }

  // the miles of the streams the filter keeps, of all of them, and of those kept a record names the chosen species on
  // (each reach's length worked out once, when first needed: a fresh, unfiltered open never does it)
  function count() {
    const F = o.features || [];
    if (!miles) miles = F.map(f => {
      const g = f.geometry || {}, parts = g.type === "MultiLineString" ? g.coordinates : g.type === "LineString" ? [g.coordinates] : [];
      let s = 0;
      parts.forEach(c => { for (let i = 1; i < c.length; i++) {
        const k = Math.cos((c[i - 1][1] + c[i][1]) * Math.PI / 360);
        s += Math.hypot((c[i][0] - c[i - 1][0]) * 69.172 * k, (c[i][1] - c[i - 1][1]) * 68.703);
      } });
      return s;
    });
    let all = 0, kept = 0, rec = 0;
    F.forEach((f, i) => {
      all += miles[i];
      if (pass(f.properties)) { kept += miles[i]; if (st.sp && recorded(f.properties, st.sp)) rec += miles[i]; }
    });
    return [kept, all, rec];
  }
  const mi = v => !v ? "0" : v >= 10 ? Math.round(v).toLocaleString("en-US") : v.toFixed(1);

  // the sliders, their values and ticks, the line under them, and the note by the panel
  function render() {
    if (!el) return;
    const fr = el.querySelector(".sfr[data-k=fish]"), fi = fr.querySelector("input"), fv = fr.querySelector(".sfv");
    if (+fi.value !== st.fish) fi.value = st.fish;
    fi.style.setProperty("--p", at(st.fish, FISH[1]));
    fv.textContent = st.fish ? `at least ${st.fish}` : "any";
    fv.classList.toggle("any", !st.fish);
    fi.setAttribute("aria-valuetext", fv.textContent);
    fr.querySelectorAll(".sft button").forEach(t => t.classList.toggle("on", +t.dataset.i === st.fish));
    // the drainage and the mean flow: each its two thumbs, the track blue between them
    Object.entries(RANGES).forEach(([k, R]) => {
      const dr = el.querySelector(`.sfr[data-k=${k}]`);
      if (!dr) return;
      const [a, b] = places(k), [lo, hi] = dr.querySelectorAll("input"), A = st[R.lo], B = st[R.hi], u = R.unit;
      if (+lo.value !== a) lo.value = a;
      if (+hi.value !== b) hi.value = b;
      const w = dr.querySelector(".sfw"), dv = dr.querySelector(".sfv");
      w.style.setProperty("--p1", at(a, TOP(k)));
      w.style.setProperty("--p2", at(b, TOP(k)));
      dv.textContent = A && B ? `${A} to ${B} ${u}` : A ? `at least ${A} ${u}` : B ? `at most ${B} ${u}` : "any";
      dv.classList.toggle("any", !A && !B);
      lo.setAttribute("aria-valuetext", A ? `at least ${A} ${u}` : "any");
      hi.setAttribute("aria-valuetext", B ? `at most ${B} ${u}` : "any");
      dr.querySelectorAll(".sft button").forEach(t => t.classList.toggle("on", +t.dataset.i === a || +t.dataset.i === b));
      const nq = dr.querySelector(".sfq");          // the flow: streams with no estimate are left out while it limits
      if (nq) nq.hidden = !(A || B);
    });
    // the species: its buttons, "recorded only" (while one is chosen) and what the two words mean
    const sr = el.querySelector(".sfr[data-k=sp]");
    if (sr) {
      sr.querySelectorAll(".sfc button").forEach(t => t.setAttribute("aria-pressed", String(t.dataset.s === st.sp)));
      const sv = sr.querySelector(".sfv");
      sv.textContent = st.sp ? SPN[st.sp] + (st.rec ? ", recorded" : "") : "any";
      sv.classList.toggle("any", !st.sp);
      sr.querySelector(".sfrec").hidden = !st.sp;
      sr.querySelector(".sfrec input").checked = st.rec;
    }
    el.querySelector(".sfclr").hidden = !on();
    const n = el.querySelector(".sfn");
    if (!on()) { n.textContent = "All streams shown"; note.hidden = true; return; }
    const [kept, all, rec] = count();
    n.innerHTML = `Showing <b>${mi(kept)}</b> of ${mi(all)} mi of streams` + (st.sp && !st.rec && kept ?
      `<br>${esc(SPN[st.sp])}: recorded on ${mi(rec)} mi, designated only on ${mi(Math.max(0, kept - rec))}` :
      st.sp && st.rec && !kept ? `<br>no trout record names ${esc(SPN[st.sp])} on these streams` : "");
    note.querySelector(".sfnt").innerHTML = `<b>Streams filtered:</b> ${esc(words())}<br><span>${mi(kept)} of ${mi(all)} mi shown</span>`;
    note.hidden = false;
  }
  // hide and show the streams (the page's own way), then tell the page (its links to the other map: "streamfilter")
  function apply() {
    clearTimeout(timer); timer = 0;
    const key = [st.fish, st.sqmi, st.sqmax, st.cfs, st.cfsmax, st.sp, st.rec].join("|");
    if (key !== applied) { applied = key; o.apply(on() ? pass : null); }
    render();
    document.dispatchEvent(new CustomEvent("streamfilter", {detail: Object.assign({}, st)}));
  }
  function set(change, now) {
    Object.assign(st, change);
    render();
    clearTimeout(timer);
    if (now) apply(); else timer = setTimeout(apply, 160);   // while a slider moves, once it rests a moment
  }

  // init({features, section, note, open, apply}): features = the drawn reaches (GeoJSON, for the miles); section = the
  // panel element the sliders go at the top of; note = an element to fill with the note (the page puts it by the panel);
  // open() = show the panel; apply(pass) = hide every stream for which pass(properties) is false (pass null: show all)
  function init(opts) {
    o = opts;
    Object.assign(st, parse(location.hash));
    // the species some stream on this map has (a record or a designation naming it): only those are offered, and one in
    // the link that none has is left out
    const seen = new Set();
    (o.features || []).forEach(f => { for (const ch of (f.properties || {}).sp || "") seen.add(ch.toUpperCase()); });
    have = SPECIES.filter(([, c]) => seen.has(c)).map(([k]) => k);
    if (!have.includes(st.sp)) { st.sp = ""; st.rec = false; }
    hasFlow = (o.features || []).some(f => hasQ(f.properties || {}));
    if (!hasFlow) { st.cfs = st.cfsmax = 0; }
    el = document.createElement("div");
    el.className = "sf";
    const ticks = (vals, max, lab) => vals.map(i => `<button type="button" data-i="${i}" tabindex="-1" style="left:` +
      `${at(i, max)}">${lab(i)}</button>`).join("");
    const head = name => `<div class="sfl"><span>${name}</span><b class="sfv"></b></div>`;
    // a two-thumb slider: one track, the least and the most shown ("any" at either end: no limit that way)
    const range = (k, extra) => { const R = RANGES[k], T = TOP(k);
      return `<div class="sfr" data-k="${k}">${head(R.name)}<div class="sfw">` +
        `<input type="range" class="lo" min="0" max="${T}" step="1" value="0" aria-label="${R.name}: the least shown">` +
        `<input type="range" class="hi" min="0" max="${T}" step="1" value="${T}" aria-label="${R.name}: the most shown">` +
        `</div><div class="sft">${ticks([...R.steps.keys(), T], T, i => i % T ? String(R.steps[i]).replace(/^0\./, ".") : "any")}` +
        `</div>${extra || ""}</div>`; };
    el.innerHTML = `<div class="sfh"><span>Filter streams</span><button type="button" class="sfclr" hidden>Show all</button></div>` +
      `<div class="sfr" data-k="fish">${head("Fish score")}<input type="range" min="0" max="${FISH[1]}" step="${FISH[2]}" ` +
      `value="0" aria-label="Fish score: the least shown"><div class="sft">${ticks([0, 25, 50, 75, 100], FISH[1],
        i => i ? i : "any")}</div></div>` +
      range("sqmi") +
      // the mean annual flow, where the reaches carry it
      (hasFlow ? range("cfs", `<div class="sfq" hidden>Streams with no flow estimate are left out</div>`) : "") +
      // the trout species: a button for each this map's streams have, and "recorded only" while one is chosen
      (have.length ? `<div class="sfr" data-k="sp">${head("Trout species")}<div class="sfc" role="group" ` +
        `aria-label="Trout species"><button type="button" data-s="">Any</button>` +
        have.map(k => `<button type="button" data-s="${k}">${SPECIES.find(x => x[0] === k)[3]}</button>`).join("") +
        `</div><label class="sfrec" hidden><input type="checkbox"><span>Recorded only<small>a survey, a stocking or a ` +
        `sighting names it here, not only a designated water</small></span></label></div>` : "") +
      `<div class="sfn"></div>`;
    o.section.insertBefore(el, o.section.firstChild);
    const fr = el.querySelector(".sfr[data-k=fish]"), fi = fr.querySelector("input");
    fi.addEventListener("input", () => set({fish: +fi.value}, false));
    fi.addEventListener("change", () => set({fish: +fi.value}, true));
    fr.querySelectorAll(".sft button").forEach(t => t.addEventListener("click", () => set({fish: +t.dataset.i}, true)));

    // each two-thumb slider's thumbs (0 the least, 1 the most): each stops a place short of the other
    Object.keys(RANGES).forEach(k => {
      const R = RANGES[k], dr = el.querySelector(`.sfr[data-k=${k}]`);
      if (!dr) return;
      const w = dr.querySelector(".sfw"), [lo, hi] = w.querySelectorAll("input"), T = TOP(k);
      const put = (which, i, now) => {
        const [a, b] = places(k), j = which ? Math.max(i, a + 1) : Math.min(i, b - 1);
        set(which ? {[R.hi]: j >= T ? 0 : R.steps[j]} : {[R.lo]: R.steps[j]}, now);
      };
      const nearer = f => { const [a, b] = places(k); return f <= a ? 0 : f >= b ? 1 : f - a <= b - f ? 0 : 1; };
      [lo, hi].forEach((inp, which) => ["input", "change"].forEach(ev =>      // keys and screen readers
        inp.addEventListener(ev, () => put(which, +inp.value, ev === "change"))));
      dr.querySelectorAll(".sft button").forEach(t => t.addEventListener("click", () => {
        const i = +t.dataset.i;
        put(nearer(i), i, true);
      }));
      // A finger or the mouse on the track moves the nearer thumb (the inputs under it take no pointer, only keys and
      // screen readers): a tap puts it there, a drag that starts sideways carries it, and one that starts up or down is
      // the panel's to scroll (touch-action: pan-y: the browser then cancels the pointer here; where it doesn't, the
      // slider leaves that finger alone all the same)
      let drag = null;
      const placeAt = x => { const r = w.getBoundingClientRect();
        return Math.max(0, Math.min(T, (x - r.left - THUMB / 2) / Math.max(1, r.width - THUMB) * T)); };
      w.addEventListener("pointerdown", e => {
        if (drag || (e.pointerType === "mouse" && e.button !== 0)) return;
        const f = placeAt(e.clientX);
        drag = {id: e.pointerId, x: e.clientX, y: e.clientY, which: nearer(f), moved: e.pointerType === "mouse", swipe: false};
        try { w.setPointerCapture(e.pointerId); } catch (_) {}
        if (drag.moved) { e.preventDefault(); put(drag.which, Math.round(f), false); }
    });
    w.addEventListener("pointermove", e => {
      if (!drag || e.pointerId !== drag.id || drag.swipe) return;
      if (!drag.moved) {
        const dx = Math.abs(e.clientX - drag.x), dy = Math.abs(e.clientY - drag.y);
        if (dx < 4 && dy < 4) return;
        if (dy > dx) { drag.swipe = true; return; }  // up or down: a scroll, not the slider's
        drag.moved = true;
      }
      put(drag.which, Math.round(placeAt(e.clientX)), false);
    });
    const end = e => {
      if (!drag || e.pointerId !== drag.id) return;
      const d = drag;
      drag = null;
      if (e.type === "pointerup" && !d.swipe) put(d.which, Math.round(placeAt(e.clientX)), true);
      else if (d.moved) apply();                   // taken away midway (a scroll, a lost capture): it stays where it got to
    };
    ["pointerup", "pointercancel", "lostpointercapture"].forEach(ev => w.addEventListener(ev, end));
    });

    const sr = el.querySelector(".sfr[data-k=sp]");
    if (sr) {
      sr.querySelectorAll(".sfc button").forEach(t => t.addEventListener("click", () =>
        set(t.dataset.s ? {sp: t.dataset.s} : {sp: "", rec: false}, true)));
      sr.querySelector(".sfrec input").addEventListener("change", e => set({rec: e.target.checked}, true));
    }

    const clear = () => { Object.assign(st, NONE); apply(); };
    el.querySelector(".sfclr").addEventListener("click", clear);
    note = o.note;
    note.classList.add("sfnote");
    note.hidden = true;
    note.innerHTML = `<span class="sfnt" role="button" tabindex="0" title="Change the filter"></span>` +
      `<button type="button" class="sfx" title="Show all streams" aria-label="Show all streams">×</button>`;
    note.querySelector(".sfx").addEventListener("click", e => { e.stopPropagation(); clear(); });
    const nt = note.querySelector(".sfnt");
    nt.addEventListener("click", () => o.open && o.open());
    nt.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); nt.click(); } });
    if (on()) apply(); else render();
  }

  if (typeof document !== "undefined" && !document.getElementById("sf-style")) {
    const s = document.createElement("style");
    s.id = "sf-style";
    const T = THUMB, track = "height:6px;border-radius:3px;background:linear-gradient(to right,#ced4da 0,#ced4da var(--p)," +
      "#1864ab var(--p),#1864ab 100%)";
    const track2 = "background:linear-gradient(to right,#ced4da 0,#ced4da var(--p1),#1864ab var(--p1),#1864ab var(--p2)," +
      "#ced4da var(--p2),#ced4da 100%)";
    const thumb = `box-sizing:border-box;width:${T}px;height:${T}px;border-radius:50%;background:#fff;border:2px solid #1864ab;` +
      "box-shadow:0 1px 3px rgba(0,0,0,.3)";
    s.textContent =
      // the sliders: a thumb a fingertip can take, on a track blue where the streams are kept
      ".sf{min-width:212px;margin:0 0 8px;padding:0 0 6px;border-bottom:1px solid #e9ecef;font-size:12px;line-height:1.35}" +
      ".sf .sfh{display:flex;justify-content:space-between;align-items:center;min-height:24px;font-weight:600;font-size:11px;" +
      "color:#495057;text-transform:uppercase;letter-spacing:.06em}" +
      ".sf .sfclr{position:relative;border:0;background:none;padding:3px 0 3px 10px;font:inherit;font-size:12px;" +
      "font-weight:400;letter-spacing:0;text-transform:none;color:#1864ab;cursor:pointer}" +
      ".sf .sfclr::after{content:'';position:absolute;inset:-8px -8px -8px -4px}.sf .sfclr[hidden]{display:none}" +

    <script>// Stream specs in the stream popups, and "Similar streams" (the user, 2026-11-25, after an r/bluelining thread on an

// estimates ("about"); a reach with no flow estimate shows neither, a reach lying in a lake no velocity, and a reach the
// DEM reads flat (a gradient under 0.05 %, shown 0.0) its velocity as "under" what it would be at 0.05 %.
//
// Similar streams: a button after the specs highlights the streams of the map whose specs are like this reach's, and
// dims the rest, as a drainage picked in the legend does. A stream is like it when
//   its mean annual flow is within x/÷ 2 of this one's (where either has no flow estimate: its drainage within x/÷ 2),
//   its slope within x/÷ 1.5 (and at least ±0.3 % points: a flat river finds flat rivers, 0–0.3 %),
//   and its lower end within ±750 ft;
// on 2026-11-25's maps that is about 1–5 % of a map's stream miles for a trout creek of 1–20 cfs (median; north Georgia

// opens by the layer panel (a tap leaves it out, another puts it back); "order" (the same Strahler order) starts off;
// "wider" takes x/÷ 3, x/÷ 2 (±0.5 points) and ±1,500 ft. The note counts the miles highlighted among the streams shown:
// the stream filters (map_filter.js) still hide what they hide, and the highlight is among what is left. It goes along
// with the switch between the 2D and 3D maps in the link, after the filter: "&like=q,gr,le,a,o,switches,name".
window.streamSpecs = (function () {
  const FT = 3.28084, SQMI = 0.386102, NB = " ";        // (a number keeps its unit on its line)

  const cfs = v => v >= 10 ? Math.round(v).toLocaleString("en-US") : v >= 1 ? v.toFixed(1) : v >= 0.01 ? v.toFixed(2) : "0.01";
  const sqmi = km2 => { const v = km2 * SQMI;
    return (v >= 100 ? Math.round(v).toLocaleString("en-US") : v >= 1 ? v.toFixed(1) : v.toFixed(2)) + NB + "sq" + NB + "mi"; };
  const feet = m => Math.round(m * FT).toLocaleString("en-US") + NB + "ft";
  const feet10 = m => (Math.round(m * FT / 10) * 10).toLocaleString("en-US");
  const has = v => v !== undefined && v !== null && v !== "" && !Number.isNaN(+v);
  const FLAT = 0.05;                                         // %: a gradient shown 0.0 is under this

  // the velocity (ft/s) at the mean annual flow q (cfs), drainage km2 and slope pct (%), as NHDPlus works it out
  // (streamspecs.velocity: Jobson's peak-concentration velocity at Q/Qa = 1)

    if (!(Q > 0 && Da > 0 && S > 0)) return null;
    const v = 0.094 + 0.0143 * Math.pow(Math.pow(Da, 1.25) * Math.sqrt(9.80665) / Q, 0.919) * Math.pow(S, 0.159) * Q / Da;
    return v / 0.3048;
  }

  const fps = v => (v >= 0.1 ? v.toFixed(1) : "0.1") + NB + "ft/s";

  // the specs, as the popup reads them ("about" on the estimates)
  function text(p) {
    const flat = has(p.gr) && +p.gr === 0, out = [];
    if (has(p.q) && +p.q >= 0.01) {
      const v = inLake(p) || !has(p.a) ? null : vel(+p.q, +p.a, flat ? FLAT : +p.gr);
      out.push(`about ${cfs(+p.q)}${NB}cfs mean` + (v === null ? "" : (flat ? ", under " : ", ") + fps(v)));
    } else out.push(has(p.q) ? `under 0.01${NB}cfs mean` : "no flow estimate");     // (06_map.py rounds to 0.01)
    if (has(p.gr)) out.push(flat ? `slope under ${FLAT}%` : `slope ${(+p.gr).toFixed(1)}%`);
    if (has(p.o)) out.push(`order ${p.o}`);
    if (has(p.a)) out.push(sqmi(+p.a));
    const e = has(p.le) ? +p.le : null;

  }

    "below it, scaled to this reach's drainage. Velocity: at that flow, by NHDPlus's own formula (Jobson 1996), from the " +
    "flow, drainage and slope. Slope and lower-end elevation: the 10 m elevation model along the reach.";
  // the popup row; opts.like false: no "Similar streams" button (a page without the highlight: 14_portable.py)
  function row(p, opts) {
    const ref = {n: p.n || null, q: has(p.q) ? +p.q : null, gr: has(p.gr) ? +p.gr : null, le: has(p.le) ? +p.le : null,
                 a: has(p.a) ? +p.a : null, o: has(p.o) ? +p.o : null, el: has(p.el) ? +p.el : null};
    const btn = (opts || {}).like === false || ref.gr === null || ref.a === null ? "" :

      el.innerHTML = loading.has(s) && !c ? `<span class="cdm">At the gauge: getting the latest reading…</span>` : "";
      return;
    }
    const why = online() ? tried[s] : "offline", st = stat(c);
    const note = why === "offline" ? "no connection" : why === "busy" ? "USGS busy" : why === "refused" ? "USGS refused"
      : why === "failed" ? "USGS didn't answer" : "";
    const live = c.src === "phone" && !note && Date.now() - c.q[1] < 3 * 3600e3;
    el.title = g ? `USGS gauge: ${g.n}` : "USGS gauge";
    el.innerHTML = `<span class="cdm">At the gauge ${live ? "now" : when(c.q[1])}:</span> ` +
      `${num(c.q[0])} cfs${st ? `, <span style="color:${GCOL[st.st] || "inherit"}">${esc(st.st)}</span>` : ""}` +
      (c.w && c.w[0] != null && !old(c.w) ? ` · water ${Math.round(c.w[0])} °F` : "") +
      ` <span class="cdm">(${[ago(c.q[1]), c.src === "map" ? "the map's data" : "", note].filter(Boolean).join("; ")})</span>`;
  }
  const siteOf = el => el.dataset.gauge || el.dataset.gaugeNow;
  const paint = el => (el.dataset.gaugeNow !== undefined ? paintCal : paintPopup)(el);
  const grew = () => document.dispatchEvent(new CustomEvent("popup-grow"));
  function repaint(sites) {
    const set = new Set(sites);
    let n = 0;
    document.querySelectorAll("[data-gauge], [data-gauge-now]").forEach(el => { if (set.has(siteOf(el))) { paint(el); n++; } });
    recolor(sites);
    if (list && !list.hidden) items();
    if (n) grew();
  }
  // a popup just opened: what it has of gauges shown at once from what is kept, then fetched where it is old
  function fill(root) {
    if (!root || !root.querySelectorAll) return;
    const els = [...root.querySelectorAll("[data-gauge], [data-gauge-now]")];
    if (!els.length) return;
    style();
    const go = refresh(els.map(siteOf));     // (marks them loading first)
    els.forEach(paint);
    grew();
    return go;
  }
  // a gauge's icon in the colour of the newest reading the phone has, where it knows how that compares with the usual
  function recolor(sites) {
    if (!opts.recolor) return;
    sites.forEach(s => {
      if (!mapGauges().has(s)) return;
      const c = cur(s), st = c && c.src === "phone" ? stat(c) : null;
      if (st && GCOL[st.st]) opts.recolor(s, GCOL[st.st]);
    });
  }

  // ---- My Waters ----
  let opts = {}, list = null, bar = null, editing = null;
  const rng = (a, b, unit) => a != null && b != null ? `${num(a)}–${num(b)} ${unit}` : a != null ? `${num(a)} ${unit} or more`
    : b != null ? `up to ${num(b)} ${unit}` : "";
  // against the visitor's ranges: [colour, words]
  function judge(f, c) {
    const checks = [];
    const one = (lab, x, lo, hi, unit) => {
      if (lo == null && hi == null) return;
      const v = x && !old(x) ? x[0] : null;
      if (v == null) { checks.push([null, `no current ${lab}`]); return; }
      const ok = (lo == null || v >= lo) && (hi == null || v <= hi);
      checks.push([ok, ok ? `${lab} in your range (${rng(lo, hi, unit)})`
                              : `${lab} ${lo != null && v < lo ? "below" : "above"} your range (${rng(lo, hi, unit)})`]);
    };
    one("flow", c && c.q, f.q0, f.q1, "cfs");
    one("height", c && c.h, f.h0, f.h1, "ft");
    if (!checks.length) return [NONE, "No range set: Edit to add yours"];
    const say = ks => { const t = ks.map(k => k[1]).join(" · "); return t[0].toUpperCase() + t.slice(1); };
    const bad = checks.filter(k => k[0] === false);
    if (bad.length) return [OUT, say(bad)];
    return [checks.some(k => k[0] === null) ? NONE : IN, say(checks)];
  }
  function short(s, c) {
    if (!c) return `<span class="gdm">${loading.has(s) ? "Getting the latest reading…" : "No reading kept on this phone"}</span>`;
    const tm = mainTime(c), st = stat(c);
    const bits = [c.q ? (old(c.q) ? "no flow reading lately" : c.q[0] == null ? `flow: no value${quals(c.q).length ? " (" + quals(c.q).join(", ") + ")" : ""}`
                         : `<b>${num(c.q[0])} cfs</b>`) : "",
                  c.h && !old(c.h) && c.h[0] != null ? `${num(c.h[0])} ft` : "",
                  c.w && !old(c.w) && c.w[0] != null ? `${Math.round(c.w[0])} °F` : ""].filter(Boolean);
    const [pre, kind] = source(s, c);
    return bits.join(" · ") + (st ? ` · <span style="color:${GCOL[st.st] || "inherit"}">${esc(st.st)}</span>` : "") +
      `<div class="gdm">${pre ? `<span class="gwarn">${esc(pre)}</span>` : ""}${kind === "USGS reading" ? "" : kind + ": "}${when(tm)} · ${ago(tm)}${loading.has(s) ? " · updating…" : ""}</div>`;
  }
  const field = (k, v, ph) => `<input name="${k}" inputmode="decimal" autocomplete="off" placeholder="${ph}" value="${v == null ? "" : esc(v)}">`;
  function itemHtml(f) {
    const c = cur(f.s), [col, words] = judge(f, c), here = mapGauges().has(f.s);
    const ed = editing === f.s;
    return `<div class="mwi${ed ? " ed" : ""}" data-s="${esc(f.s)}">` +
      `<div class="mwt"><i class="mwd" style="background:${col}"></i><b>${esc(f.n)}</b>` +
      `<button type="button" class="mwb" data-act="edit">${ed ? "Close" : "Edit"}</button></div>` +
      `<div class="mwv">${short(f.s, c)}</div><div class="mwj" style="color:${col === NONE ? "#6b7280" : col}">${esc(words)}</div>` +
      `<div class="mwa"><a href="#" data-act="go">Show on map ›</a> <span class="gdm">${here ? "this map" : esc(f.at || f.a || "")}` +
      `${f.g && f.g !== f.n ? " · " + esc(f.g) : ""}</span></div>` +
      (ed ? `<form class="mwed" data-s="${esc(f.s)}" novalidate>` +
        `<label class="mwrow">Name <input name="n" autocomplete="off" value="${esc(f.n)}"></label>` +
        `<div class="mwrow">Ideal flow ${field("q0", f.q0, "least")} – ${field("q1", f.q1, "most")} cfs</div>` +
        `<div class="mwrow">Gauge height ${field("h0", f.h0, "least")} – ${field("h1", f.h1, "most")} ft</div>` +
        `<div class="gdm">Leave a box empty for no limit; the height is optional.</div><div class="mwmsg"></div>` +
        `<div class="mwbtns"><button type="submit" class="mwsave">Save</button><button type="button" data-act="cancel">Cancel</button>` +
        `<button type="button" data-act="remove" class="mwdel">Remove</button></div></form>` : "") + `</div>`;
  }
  // the list: drawn whole when gauges come or go or the editor opens; the readings alone otherwise (what the visitor is
  // typing stays)
  function draw() {
    if (!list) return;
    const F = favs();
    list.querySelector(".mwn").textContent = F.length ? `(${F.length})` : "";
    list.querySelector(".mwl").innerHTML = F.length ? F.map(itemHtml).join("")
      : `<div class="mwempty">No gauges yet. Turn on the gauges layer (View &amp; layers), tap a gauge, then ` +
        `<b>☆ Add to My Waters</b>.</div>`;
    list.querySelector(".mwst").innerHTML = storeOk ? "" : `<span class="gwarn">This browser isn't keeping data for this site ` +
      `(private browsing?): the list goes when the page closes.</span>`;
  }
  function items() {
    if (!list) return;
    const F = favs();
    list.querySelectorAll(".mwi").forEach(el => {
      const f = F.find(x => x.s === el.dataset.s);
      if (!f) return;
      const c = cur(f.s), [col, words] = judge(f, c);
      el.querySelector(".mwd").style.background = col;
      el.querySelector(".mwv").innerHTML = short(f.s, c);
      const j = el.querySelector(".mwj");
      j.textContent = words; j.style.color = col === NONE ? "#6b7280" : col;
    });
    const ts = F.map(f => (readings()[f.s] || {}).f || 0).filter(Boolean);
    list.querySelector(".mwup").textContent = F.length && ts.length ? `Checked ${when(Math.max(...ts))}` : "";
  }
  function buildList() {
    list = document.createElement("div");
    list.className = "mw";
    list.hidden = true;
    list.setAttribute("role", "dialog");
    list.setAttribute("aria-label", "My Waters");
    list.innerHTML = `<div class="mwh"><b>★ My Waters <span class="mwn"></span></b><span>` +
      `<button type="button" data-act="refresh" title="Get the latest readings" aria-label="Get the latest readings">↻</button>` +
      `<button type="button" data-act="close" title="Close" aria-label="Close">×</button></span></div>` +
      `<div class="mws"><span class="mwup"></span> <span class="mwst"></span></div><div class="mwl"></div>` +
      `<div class="mwf">Flows from USGS gauges (provisional data), read by this browser. Kept on this device only, ` +
      `with no account.</div>`;
    (opts.host || document.body).appendChild(list);
    if (opts.shield) opts.shield(list);
    list.addEventListener("click", e => {
      const a = e.target.closest("[data-act]");
      if (!a) return;
      e.preventDefault();
      const it = a.closest(".mwi"), s = it && it.dataset.s, act = a.dataset.act;
      if (act === "close") close();
      else if (act === "refresh") { const F = favs().map(f => f.s); if (F.length) { refresh(F, true); items(); } }
      else if (act === "edit") { editing = editing === s ? null : s; draw(); focusEditor(); }
      else if (act === "cancel") { editing = null; draw(); }
      else if (act === "remove") {
        const f = favs().find(x => x.s === s);
        if (f && confirm(`Remove ${f.n} from My Waters?`)) { saveFavs(favs().filter(x => x.s !== s)); editing = null; draw(); repaint([s]); }
      } else if (act === "go") goTo(favs().find(x => x.s === s));
    });
    list.addEventListener("submit", e => {
      e.preventDefault();
      const fm = e.target, s = fm.dataset.s, msg = fm.querySelector(".mwmsg");
      const numIn = k => { const t = String(fm.elements[k].value || "").trim().replace(/,/g, "");
                           if (!t) return null; const v = Number(t); return isFinite(v) && v >= 0 ? v : NaN; };
      let [q0, q1, h0, h1] = ["q0", "q1", "h0", "h1"].map(numIn);
      if ([q0, q1, h0, h1].some(v => Number.isNaN(v))) { msg.textContent = "Numbers only, 0 or more (or leave the box empty)."; return; }
      if (q0 != null && q1 != null && q0 > q1) [q0, q1] = [q1, q0];
      if (h0 != null && h1 != null && h0 > h1) [h0, h1] = [h1, h0];
      const F = favs(), f = F.find(x => x.s === s);
      if (!f) return;
      Object.assign(f, {n: String(fm.elements.n.value || "").trim().slice(0, 80) || f.g || "USGS " + s, q0, q1, h0, h1});
      saveFavs(F);
      editing = null;
      draw(); items();
    });
  }
  function focusEditor() {
    const fm = list && list.querySelector(".mwed");
    if (!fm) return;
    fm.scrollIntoView({block: "nearest"});
    const empty = ["q0", "q1"].map(k => fm.elements[k]).find(i => !i.value);
    if (empty && window.innerWidth > 640) empty.focus();     // (on a phone the keyboard would cover the list at once)
  }
  // the list; edit: a gauge whose editor opens (one just added), at: one to show (one already in it)
  function open(edit, at) {
    if (!list) buildList();
    editing = edit || null;
    list.hidden = false;
    draw(); items();
    if (editing) focusEditor();
    const it = at && [...list.querySelectorAll(".mwi")].find(el => el.dataset.s === at);
    if (it) { it.scrollIntoView({block: "nearest"}); it.classList.add("hl"); setTimeout(() => it.classList.remove("hl"), 1600); }
    const F = favs().map(f => f.s);
    if (F.length) refresh(F);
  }
  function close() { if (list) { list.hidden = true; editing = null; } }
  function add(s) {
    const F = favs();
    if (F.some(f => f.s === s)) return;
    const g = mapGauges().get(s) || {}, L0 = LBLX();
    F.push({s, n: g.n || "USGS " + s, g: g.n || "", a: L0.area || "", at: L0.title || "", y: g.y, x: g.x,
            q0: null, q1: null, h0: null, h1: null, add: Date.now()});
    saveFavs(F);
    repaint([s]);
  }
  // a gauge on this map: its popup here; one on another map: that map, the gauges on, its popup opened (the link's
  // gauge=, read by fromHash there)
  function goTo(f) {
    if (!f) return;
    if (mapGauges().has(f.s) && opts.show) { if (window.innerWidth <= 640) close(); opts.show(f.s); return; }
    if (!f.a || f.y == null) return;
    const page = opts.kind === "3d" ? "stream_map_3d.html" : "stream_map.html";
    location.href = `../${encodeURIComponent(f.a)}/${page}#${(+f.y).toFixed(5)},${(+f.x).toFixed(5)},13&on=gauges&gauge=${f.s}`;
  }
  function fromHash() {
    const m = /[#&]gauge=(\d{8,15})(?=&|$)/.exec(location.hash);
    if (!m) return;
    history.replaceState(null, "", location.href.replace(/&gauge=\d+(?=&|$)/, ""));
    if (mapGauges().has(m[1]) && opts.show) setTimeout(() => opts.show(m[1]), 250);
  }
  const STAR = '<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 2.6l2.9 6 6.6.8-4.9 4.6 1.3 6.5L12 17.3l-5.9 3.2 1.3-6.5L2.5 9.4l6.6-.8z" ' +
    'fill="currentColor" stroke="#7a5b00" stroke-width="1" stroke-linejoin="round"/></svg>';
  function syncButton() { if (bar) bar.style.display = favs().length ? "" : "none"; }

  // the pages, once their map is ready. o: {kind: "2d" | "3d", host: where the list goes (the map's own element, so it
  // shows in full screen too), shield(el): keeps the map's gestures out of it, place(button) -> the bar it sits in
  // (under the map's buttons), show(site): goes to a gauge of this map and opens its popup, recolor(site, colour)}
  function mount(o) {
    opts = o || {};
    style();
    if (opts.place) {
      const b = document.createElement(opts.kind === "3d" ? "button" : "a");
      b.className = "mwbtn";
      b.title = "My Waters: the gauges you follow";
      b.setAttribute("aria-label", "My Waters");
      if (b.tagName === "A") { b.href = "#"; b.setAttribute("role", "button"); } else b.type = "button";
      b.innerHTML = STAR;
      b.addEventListener("click", e => { e.preventDefault(); e.stopPropagation(); if (list && !list.hidden) close(); else open(); });
      bar = opts.place(b);
      syncButton();
    }
    recolor([...mapGauges().keys()]);
    fromHash();
    addEventListener("hashchange", fromHash);
    // an area saved for offline use keeps its gauges' last readings: fetched as it is saved, and when it is opened with
    // a connection and they are older than AREA_OLD
    const area = LBLX().area, all = () => [...mapGauges().keys()];
    const areaRefresh = force => { const r = readings(), now = Date.now();
      const due = all().filter(s => force || !r[s] || !(now - (r[s].f || 0) <= AREA_OLD));
      if (due.length && online()) refresh(due, true); };
    if (area && window.StreamsOffline && StreamsOffline.saved)
      StreamsOffline.saved(area).then(y => { if (y) areaRefresh(false); }).catch(() => {});
    document.addEventListener("streams-saved", e => { if (e.detail && e.detail.area === area) areaRefresh(true); });
    // the connection back: what is on the screen is fetched again
    if (window.StreamsOffline && StreamsOffline.onNet) StreamsOffline.onNet(on => {
      const shown = [...document.querySelectorAll("[data-gauge], [data-gauge-now]")].map(siteOf)
        .concat(list && !list.hidden ? favs().map(f => f.s) : []);
      if (on && shown.length) refresh(shown, true); else repaint(shown);
    });
    // the list changed in another tab
    addEventListener("storage", e => {
      if (e.key === KEY_R) R = null;
      if (e.key === KEY_W || e.key === KEY_R) { syncButton(); if (list && !list.hidden) { draw(); items(); } }
    });
  }
  // the buttons in the gauge popups (taps anywhere on the page, before a map stops them)
  document.addEventListener("click", e => {
    const b = e.target.closest && e.target.closest(".gfav");
    if (!b) return;
    e.preventDefault();
    e.stopPropagation();
    const s = b.dataset.fav;
    if (!s) return;
    if (isFav(s)) open(null, s);
    else { add(s); open(s); }
  }, true);

  let styled = false;
  function style() {
    if (styled || document.getElementById("gl-style")) return;
    styled = true;
    const st = document.createElement("style");
    st.id = "gl-style";
    st.textContent =
      // the gauge popups and the calendar's line
      ".gpop .gt{border-collapse:collapse;margin:4px 0 2px}.gpop .gt td{padding:1px 8px 1px 0;vertical-align:top}" +
      ".gpop .gt td:first-child{color:#6b7280;white-space:nowrap}.gsub,.gwhen,.gdm{color:#6b7280}.gsub,.gwhen{font-size:11px}" +
      ".gwhen{margin-top:2px;line-height:1.35}.gwarn{color:#a61e4d}.gst{font-weight:600}" +
      ".gact{display:flex;align-items:center;flex-wrap:wrap;gap:6px 12px;margin-top:6px}" +
      ".gfav{font:inherit;font-size:12px;line-height:1.2;border:1px solid #c9ced6;border-radius:15px;background:#fff;" +
      "color:#1d1d1f;padding:5px 11px;cursor:pointer;-webkit-tap-highlight-color:transparent}" +
      ".gfav.on{border-color:#e0a800;background:#fff9db}.glc{margin-top:3px;line-height:1.35}" +
      // the ★ button under the map's buttons
      ".leaflet-bar a.mwbtn,.maplibregl-ctrl-group button.mwbtn{display:flex;align-items:center;justify-content:center;color:#f0b400}" +
      // the list
      ".mw{position:absolute;z-index:1100;top:10px;right:10px;width:310px;max-width:calc(100% - 20px);max-height:calc(100% - 20px);" +
      "display:flex;flex-direction:column;box-sizing:border-box;background:rgba(255,255,255,.97);border-radius:10px;" +
      "box-shadow:0 2px 12px rgba(0,0,0,.28);font:13px/1.4 system-ui,-apple-system,sans-serif;color:#1d1d1f;cursor:auto}" +
      ".mw[hidden]{display:none}.mwh{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px 6px;" +
      "border-bottom:1px solid #e9ecef}.mwh b{font-size:14px}.mwn{color:#6b7280;font-weight:400}" +
      ".mwh button{border:0;background:#f1f3f5;border-radius:6px;min-width:32px;height:30px;margin-left:6px;font-size:17px;" +
      "line-height:1;cursor:pointer;color:#1d1d1f}.mws{padding:3px 10px 0;color:#6b7280;font-size:11px}.mws:empty{display:none}" +
      ".mwl{overflow-y:auto;min-height:0;padding:0 10px;touch-action:pan-y;-webkit-overflow-scrolling:touch}" +
      ".mwi{border-bottom:1px solid #eef0f2;padding:8px 0;transition:background .4s}.mwi.hl{background:#fff9db}.mwt{display:flex;align-items:center;gap:7px}" +
      ".mwt b{flex:1;min-width:0;overflow-wrap:anywhere}.mwd{flex:none;width:12px;height:12px;border-radius:50%;" +
      "box-shadow:0 0 0 1px rgba(0,0,0,.25) inset}.mwb{flex:none;font:inherit;font-size:12px;border:1px solid #c9ced6;" +
      "border-radius:6px;background:#fff;padding:4px 9px;cursor:pointer;color:#1d1d1f}" +
      ".mwv,.mwj,.mwa{margin-left:19px}.mwv .gdm{font-size:11px}.mwj{font-size:12px}.mwa{margin-top:3px;font-size:12px}" +
      ".mwa a{color:#1864ab;font-weight:600;text-decoration:none}.mwempty{padding:12px 0;color:#495057}" +
      ".mwed{margin:6px 0 2px 19px;padding:8px;background:#f4f6f8;border-radius:8px}" +
      ".mwrow{display:flex;align-items:center;flex-wrap:wrap;gap:4px 6px;margin-bottom:6px}" +
      // (a field under 16 px makes iPhone Safari zoom in on it)
      ".mwed input{font:16px system-ui,-apple-system,sans-serif;box-sizing:border-box;border:1px solid #c9ced6;" +
      "border-radius:6px;padding:4px 6px;background:#fff;color:#1d1d1f}.mwed input[name=n]{flex:1;min-width:150px}" +
      ".mwed input[inputmode]{width:76px}.mwmsg{color:#c92a2a;font-size:12px;min-height:0}" +
      ".mwbtns{display:flex;gap:6px;margin-top:6px}.mwbtns button{font:inherit;flex:1;border:1px solid #c9ced6;" +
      "border-radius:6px;background:#fff;padding:6px 4px;cursor:pointer;color:#1d1d1f}" +
      ".mwbtns .mwsave{background:#1864ab;border-color:#1864ab;color:#fff;font-weight:600}.mwbtns .mwdel{color:#c92a2a}" +
      ".mwf{padding:6px 10px 8px;color:#6b7280;font-size:11px;border-top:1px solid #e9ecef}" +
      "@media (max-width:640px){.mw{left:10px;right:10px;width:auto;max-width:none}}";
    document.head.appendChild(st);
  }

  window.gaugeLive = {fill, mount, open, refresh, cur, readings, favs, _rel: rel};
})();
</script>

  text-shadow: 0 0 3px #fff, 0 0 3px #fff, 0 0 2px #fff, 0 0 6px #fff; pointer-events: none; }

/* Shared by the area maps (06_map.py), the map of all areas (13_overview.py) and the one-file phone map

/* phones: the credits fold to one line (a tap shows them all, another folds them again); the controls at the bottom

@media (max-width: 640px) {
  .leaflet-container .leaflet-control-attribution {

  .leaflet-container .leaflet-control-attribution.open { white-space: normal; overflow: visible; line-height: 1.35; }

     Leaflet's margins (46 px; 28 on the phone map) and its 5 px pan padding on each side. Leaflet measures the popup

</style>
<script>// Shared by the area maps (06_map.py), the map of all areas (13_overview.py) and the one-file phone map
// (14_portable.py); its styles are in map_phone.css.
// phoneControls(map):
//  - on a phone the credits fold to one line: a tap opens them, another tap (not on a link) folds them again;
//  - a "my location" button under the zoom buttons: a tap asks the browser where you are and puts the map there, with
//    a blue dot and a ring for the fix's accuracy. The dot then keeps moving with you; another tap centres on it again;
//  - popups keep clear of the buttons at the top, and their heads and open fish-score breakdowns of the legend too
//    (keepPopupsClear).
function phoneControls(map) {
  keepPopupsClear(map);
  const attr = map.attributionControl && map.attributionControl.getContainer();
  if (attr) {
    attr.title = "Map and data credits";
    L.DomEvent.on(attr, "click", e => {
      if (window.innerWidth > 640) return;
      if (!attr.classList.contains("open")) { L.DomEvent.preventDefault(e); attr.classList.add("open"); }
      else if (!(e.target.closest && e.target.closest("a"))) attr.classList.remove("open");
    });
  }
  if (!navigator.geolocation) return;
  const ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">'
    + '<circle cx="12" cy="12" r="3.5" fill="currentColor"/><circle cx="12" cy="12" r="7.5"/>'
    + '<path d="M12 1.5v3M12 19.5v3M1.5 12h3M19.5 12h3"/></svg>';
  let btn = null, dot = null, ring = null, last = null, centre = false, watching = false, note = null, noteTimer = 0;
  const say = text => {
    if (!note) { note = L.control({position: "topleft"}); note.onAdd = () => L.DomUtil.create("div", "locme-msg"); }
    note.addTo(map); note.getContainer().textContent = text;
    clearTimeout(noteTimer); noteTimer = setTimeout(() => note.remove(), 6000);
  };
  const zoomTo = () => Math.max(map.getZoom(), 14);
  // on a phone the panel at the bottom can cover the middle of the map: put the dot in the middle of what is left
  const goTo = latlng => {
    const z = zoomTo(), size = map.getSize(), box = map.getContainer().getBoundingClientRect();
    let cover = 0;
    document.querySelectorAll(".leaflet-bottom .leaflet-control").forEach(c => {
      const r = c.getBoundingClientRect();
      if (r.width > size.x / 2 && r.height > 0) cover = Math.max(cover, box.bottom - r.top);
    });
    cover = Math.min(Math.max(cover, 0), size.y * 0.7);
    map.setView(map.unproject(map.project(latlng, z).add([0, cover / 2]), z), z);
  };
  const ctl = L.control({position: "topleft"});
  ctl.onAdd = () => {
    const bar = L.DomUtil.create("div", "leaflet-bar leaflet-control");
    btn = L.DomUtil.create("a", "locme", bar);
    btn.href = "#"; btn.title = "Show my location"; btn.innerHTML = ICON;
    btn.setAttribute("role", "button"); btn.setAttribute("aria-label", "Show my location");
    L.DomEvent.disableClickPropagation(bar);
    L.DomEvent.on(btn, "click", e => {
      L.DomEvent.preventDefault(e);
      if (last) goTo(last.latlng); else centre = true;
      if (!watching) {
        watching = true; btn.classList.add("busy");
        map.locate({watch: true, setView: false, enableHighAccuracy: true, maximumAge: 15000, timeout: 20000});
      }
    });
    return bar;
  };
  ctl.addTo(map);
  map.on("locationfound", e => {
    last = e; btn.classList.remove("busy"); btn.classList.add("on");
    if (!dot) {
      ring = L.circle(e.latlng, {radius: e.accuracy, color: "#1c7ed6", weight: 1, opacity: .5, fillOpacity: .12,
                                 interactive: false}).addTo(map);
      dot = L.circleMarker(e.latlng, {radius: 7, color: "#fff", weight: 2.5, fillColor: "#1c7ed6", fillOpacity: 1,
                                      interactive: false}).addTo(map);
    } else { dot.setLatLng(e.latlng); ring.setLatLng(e.latlng).setRadius(e.accuracy); }
    if (centre) { centre = false; goTo(e.latlng); }
  });
  map.on("locationerror", e => {
    if (last && e.code !== 1) return;              // a slow fix while the dot is already shown: keep the last one
    map.stopLocate(); watching = false; centre = false;
    btn.classList.remove("busy"); if (e.code === 1) btn.classList.remove("on");
    say(e.code === 1 ? "Location is blocked for this page: allow it in the browser's settings, then tap again."
                     : "Your location isn't available right now; tap to try again.");
  });
}

// Popups keep clear of the controls at the top of the map (zoom, full screen, my location, layers, the phone map's
// panel). Leaflet pans a popup into view as it opens but doesn't count them, and doesn't pan again when the popup's
// content changes: on a phone a stream popup's first lines, its name and fish score, sat under the buttons at the top
// left. Once Leaflet's own pan is done, and when the fish score's breakdown opens or folds on a tap (map_score.js's
// "fs-toggle"), the map pans the popup (or the open breakdown) to the right of the buttons where it fits there (a wide
// screen), else below them; and brings the popup's head (its first lines down to the fish score, or its name) or the
// open breakdown up into view, above the controls at the bottom too. Where that is taller than the room the area map's
// legend leaves, the legend folds while it needs the room (on a phone it stands open over the lower half at first: at
// 320 x 568 it covered the popup's name and fish score, at 375 x 812 the breakdown's last rows, the score among them)
// and comes back when the breakdown folds (if folded for it) or the popup closes. With the breakdown folded, a trout
// calendar the user tapped (map_calendar.js, the same event) is what must be seen, the half-month's reasons under its
// strip included: at 375 x 812 the open legend covered them. Not on hover: the popup would move away from the pointer.
function keepPopupsClear(map) {
  let open = null, folded = [];          // the legends folded for the popup: [legend, for its head (else its breakdown)]
  // those folded for the breakdown come back when it folds, all of them when the popup closes and no other opens in its
  // place (those still folded: one the user opened again is left as it is)
  const unfold = all => { folded = folded.filter(([d, head]) => {
    if (head && !all) return true;
    if (d.classList.contains("min")) d.querySelector(".lx").click();
    return false; }); };
  const union = els => {
    const r = els.map(e => e.getBoundingClientRect()).filter(b => b.width && b.height);
    return r.length ? {left: Math.min(...r.map(b => b.left)), top: Math.min(...r.map(b => b.top)),
                       right: Math.max(...r.map(b => b.right)), bottom: Math.max(...r.map(b => b.bottom))} : null;
  };
  // A pan or zoom of Leaflet's still under way: the popup measured now is where it was, and a pan of ours started now
  // cuts Leaflet's short. On a big area map the page is busy as the popup opens, the check at 350 ms came before
  // Leaflet's own pan had moved, and its pan down kept the popup 33 px past the left edge (375 px). It waits for the
  // pan's end. The user's own drag is left alone.
  const busy = () => !!((map._panAnim && map._panAnim._inProgress) || map._animatingZoom);
  let waiting = false;
  const clear = (again = 1) => {
    const el = open && open.isOpen() && open.getElement();
    if (!el || (map.dragging && map.dragging._draggable && map.dragging._draggable._moving)) return;
    if (busy()) {
      if (!waiting) { waiting = true; map.once("moveend", () => { waiting = false; setTimeout(() => clear(again)); }); }
      return;
    }
    // with the breakdown open it is what must be seen whole and clear of the controls (the popup's head may go under
    // them meanwhile: on a 568 px screen the two don't fit at once); folded, a trout calendar the user tapped, else the
    // popup's head, down to its fish score (or its name)
    const w = el.querySelector(".leaflet-popup-content-wrapper") || el;
    const fsb = [...el.querySelectorAll(".fsb")].filter(b => getComputedStyle(b).display !== "none");
    const shown = fsb.length ? fsb : [...el.querySelectorAll(".calc.tapped")];
    const p = union(shown.length ? shown : [w]);
    if (!p) return;
    const h = !shown.length && (w.querySelector(".fsr") || w.querySelector("b"));
    const foot = h ? Math.min(p.bottom, h.getBoundingClientRect().bottom) : p.bottom;
    const c = map.getContainer(), m = c.getBoundingClientRect();
    const tl = union([...c.querySelectorAll(".leaflet-top.leaflet-left .leaflet-control")]);
    const tr = union([...c.querySelectorAll(".leaflet-top.leaflet-right .leaflet-control")]);
    const across = (b, dx) => b && p.left + dx < b.right && p.right + dx > b.left;
    const hits = [tl, tr].filter(b => across(b, 0) && p.top < b.bottom && p.bottom > b.top);
    let dx = 0, dy = 0;
    if (hits.length) {
      const right = hits.length === 1 && hits[0] === tl ? tl.right + 6 - p.left : 0;
      const room = (tr && p.top < tr.bottom ? tr.left : m.right) - 5;
      if (right && p.right + right <= room) dx = right;
      else dy = Math.max(...hits.map(b => b.bottom)) + 6 - p.top;
    }
    // a panel opened at the top over half the map is the user's: leave the popup where it is. Else what must be seen
    // comes up into view, above the controls at the bottom too (the area map's legend, the scale, the credits line),
    // where there is room under the controls at the top
    if (dy > m.height / 2) dy = 0;
    else {
      const floor = Math.min(m.bottom, ...[...c.querySelectorAll(".leaflet-bottom .leaflet-control")]
        .map(b => b.getBoundingClientRect()).filter(b => b.width && b.height && p.left + dx < b.right && p.right + dx > b.left)
        .map(b => b.top)) - 5;
      const ceil = Math.max(m.top, ...[tl, tr].filter(b => across(b, dx)).map(b => b.bottom)) + 6;
      const lg = foot - p.top > floor - ceil ? [...c.querySelectorAll(".lgd:not(.min)")]
        .filter(d => { const b = d.getBoundingClientRect(); return p.left + dx < b.right && p.right + dx > b.left; }) : [];
      if (lg.length) {                         // taller than the room the open legend leaves: the legend folds
        lg.forEach(d => { d.querySelector(".lx").click(); folded.push([d, !shown.length]); });
        requestAnimationFrame(() => clear(again));
        return;
      }
      if (foot + dy > floor) dy = Math.max(floor - foot, ceil - p.top);
      // above the room: a popup lifted for its breakdown kept its name off the top of the screen once it folded (a
      // pixel's slack: Leaflet's own pan leaves 5 px, the room 6)
      else if (p.top + dy < ceil - 1) dy = ceil - p.top;
    }
    if (!dx && !dy) return;
    map.panBy([-dx, -dy]);
    if (again && shown.length) map.once("moveend", () => clear(again - 1));
  };
  // After Leaflet's own pan, and again at 350 ms and 1 s: on a slow phone its pan ran past a single check, which then
  // saw the popup mid-way and was spent (320 px). A check moves the popup only where it still overlaps the controls;
  // the listener goes after 1 s, so a pan of the user's own later is left alone.
  map.on("popupopen", e => {
    open = e.popup;
    folded.forEach(f => { f[1] = true; });   // a popup opened in place of another keeps the legends folded for that one
    const p = e.popup, now = () => { if (open === p) clear(0); };
    map.on("moveend", now);
    setTimeout(now, 350);
    setTimeout(() => { now(); map.off("moveend", now); }, 1000);
  });
  // Leaflet closes a popup before it opens the next in its place: the legends come back only if none opened
  map.on("popupclose", e => { if (open === e.popup) { open = null; setTimeout(() => { if (!open) unfold(true); }); } });
  document.addEventListener("fs-toggle", () => {
    const el = open && open.isOpen() && open.getElement();
    if (el && !el.querySelector(".fsr.open")) unfold(false);
    clear();
  });
  // a popup whose content changed after it opened (map_gauges.js: a gauge's reading came in): Leaflet lays it out and
  // pans it into view again (its own update() would put back the content it opened with), then it is kept clear
  document.addEventListener("popup-grow", () => {
    if (!open || !open.isOpen()) return;
    if (open._updateLayout) { open._updateLayout(); open._updatePosition(); open._adjustPan(); }
    clear();
  });
}
// The fish score's breakdown in the stream popups: it opens under the score while the pointer is on that line on a
// computer, and on a tap on a phone (another tap folds it; a click pins it on a computer). Shared by the area maps
// (map_drainages.js and map3d.html, inlined by 06_map.py) and the one-file phone map (14_portable.py); it adds its
// own styles. Each reach carries fx (06_map.py fs_parts): the terms scoring.score() combines, which fsParts multiplies
// out as score() does, operation by operation, so the breakdown comes to the score shown:
//   100 × water × (0.30 size + 0.30 thermal + 0.15 gradient + 0.25 remoteness) × burn × trout × heat × channel × warm,
//   capped at 100 and rounded (a half to the even number, as numpy does); thermal = 0.5 water temperature + 0.35 shade
//   + 0.15 north-facing slope
// Each line gives what the reach reads, in the popup's own words and imperial units (units.py), and what it adds or
// multiplies. 06_map.py checks that every drawn reach's fx comes to its score, and audit/scripts/fish_breakdown_check.js
// runs this file on every reach of every map.
(function () {
  const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
  const clip = v => Math.min(Math.max(v, 0), 1);
  const num = v => v === undefined || v === "-" ? null : Number(v);
  // units.py's degf and sqmi; a number keeps its unit on its line (\u00a0, a space no line breaks at)
  const degf = c => Math.round(c * 9 / 5 + 32) + "\u00a0°F";
  const sqmi = km2 => { const v = km2 * 0.386102;
    return (v >= 100 ? Math.round(v).toLocaleString("en-US") : v >= 1 ? v.toFixed(1) : v.toFixed(2)) + "\u00a0sq\u00a0mi"; };
  // numpy's round: a half goes to the even number (the score lies between 0 and 100)
  const rint = x => { const f = Math.floor(x), d = x - f; return d > 0.5 ? f + 1 : d < 0.5 ? f : f % 2 ? f + 1 : f; };
  const BROOK = 6;             // scoring.BROOK_SCALE: wild brook trout water's drainage counts six times over

  // fx -> the reach's terms and its score before and after rounding; null for a reach without fx
  function fsParts(p) {
    if (!p || typeof p.fx !== "string" || p.gr == null) return null;
    const t = p.fx.split(" ");
    const r = {W: num(t[0]), S: num(t[1]), wt: num(t[2]), cp: num(t[3]), sp: num(t[4]),
               nn: t[5] === "-" ? null : Number(t[5]) / 100, am: num(t[6]), bm: num(t[7]), gr: p.gr,

function layerKey2d(name, LBL) {

  const drop = text.match(/Drops: (.+)$/);

  if (has(L.falls)) return "falls";

  if (has(L.trout_waters)) return "wild_trout_waters";
  if (has(L.access)) return "cpad_restricted";
  if (has(L.land)) return "land";
  if (has(L.gauges)) return "gauges";
  if (has(L.trout_ev)) return "trout";

// when switching from 2d to 3d"), in the link itself, after the view: #lat,lon,zoom[,pitch,bearing]&on=..&off=..&base=..
// with the keys above. "on" lists the layers the page shows that it opens without, "off" those it opens with that are
// off, "base" its base map when that isn't the one it opens with (gray, topo, sat; otm on the 2D map only). The page the
// link opens turns on and off the layers it has and leaves its others as it opens them (both pages open with the same
// ones: streams, drainages, the long trail, lakes, terrain shading and labels), and keeps the rest of the list (the
// layers only the other page has) in its own link back, so they are on again after a round trip. A link without the
// list (a fresh open, the overview's and the profiles' links) opens the default layers.

  enc: k => String(k).replace(/[%&,=#+]/g, encodeURIComponent).replace(/ /g, "+"),

  parse(hash) {
